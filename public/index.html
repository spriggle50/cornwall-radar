      const title = "🎉 Events & What's On";
      if (!d) return '<div class="card"><h2>' + title + '</h2><p class="unavailable">Unavailable right now</p></div>';

      const w = d.whatson;
      const ev = d.events;

      let whatsonBlock = '';
      if (w && w.unavailable) {
        whatsonBlock = '<h3 class="wd-subhead">What\'s On in Cornwall</h3><p class="unavailable">Unavailable right now (' + w.error + ')</p>';
      } else if (!w || !w.items || !w.items.length) {
        whatsonBlock = '<h3 class="wd-subhead">What\'s On in Cornwall</h3><p class="unavailable">No items available right now</p>';
      } else {
        const cards = w.items.map(item => {
          const img = item.image
            ? '<img class="feed-card-img" src="' + item.image + '" alt="" loading="lazy" />'
            : '<div class="feed-card-img-placeholder">🎉</div>';
          return '<a class="feed-card" href="' + item.link + '" target="_blank">'
            + img
            + '<div class="feed-card-body">'
            + '<div class="feed-card-title">' + item.title + '</div>'
            + (item.date ? '<div class="feed-card-date">' + item.date + '</div>' : '')
            + '</div></a>';
        }).join('');
        whatsonBlock = '<h3 class="wd-subhead">What\'s On in Cornwall</h3><div class="feed-grid">' + cards + '</div>';
      }

      let eventsBlock = '';
      if (ev && ev.configured === false) {
        eventsBlock = '<h3 class="wd-subhead">Local Events</h3><p class="unavailable">' + ev.message + '</p>';
      } else if (ev && ev.unavailable) {
        eventsBlock = '<h3 class="wd-subhead">Local Events</h3><p class="unavailable">Unavailable right now (' + ev.error + ')</p>';
      } else if (ev && ev.configured && ev.events && ev.events.length) {
        const notes = (ev.sourceNotes && ev.sourceNotes.length)
          ? '<p class="section-subtitle" style="color:#b45309;">' + ev.sourceNotes.join(' · ') + '</p>'
          : '';
        const groups = {};
        ev.events.forEach(e => {
          const dt = e.date ? new Date(e.date) : null;
          const key = (dt && !isNaN(dt)) ? dt.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : 'Date TBC';
          (groups[key] = groups[key] || []).push(e);
        });
        const groupsHtml = Object.entries(groups).map(([month, evts]) => {
          const cards = evts.map(e => {
            const dt = e.date ? new Date(e.date) : null;
            const dateStr = (dt && !isNaN(dt)) ? dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : 'Date TBC';
            const price = e.priceMin === 0 ? 'Free' : (e.priceMin != null ? 'From £' + Math.round(e.priceMin) : 'TBC');
            const img = e.image ? '<img class="event-card-img" src="' + e.image + '" alt="" loading="lazy" />' : '';
            return '<div class="event-card">'
              + img
              + '<div class="event-card-body">'
              + '<div class="event-card-meta-top"><span class="event-cat-pill">' + (e.subCategory || e.category) + '</span></div>'
              + '<div class="event-card-name">' + e.name + '</div>'
              + '<div class="event-card-venue">📍 ' + e.venue + (e.city ? ' · ' + e.city : '') + '</div>'
              + '<div class="event-card-date">📅 ' + dateStr + (e.time ? ' · ' + e.time : '') + ' &nbsp;·&nbsp; 🎟 ' + price + '</div>'
              + (e.url ? '<a class="event-tickets-btn" href="' + e.url + '" target="_blank">🎟 Tickets</a>' : '')
              + '</div></div>';
          }).join('');
          return '<div class="event-month-group"><div class="event-month-label">' + month + '</div><div class="events-grid">' + cards + '</div></div>';
        }).join('');
        eventsBlock = '<h3 class="wd-subhead">Local Events</h3>' + notes + groupsHtml;
      } else if (ev && ev.configured) {
        eventsBlock = '<h3 class="wd-subhead">Local Events</h3><p class="unavailable">No events found nearby right now — try again later</p>';
      }

      return '<div class="card"><h2>' + title + '</h2>' + whatsonBlock + eventsBlock + '</div>';
    }

    function renderNewsDetail(n) {
      const title = '📰 Cornwall News';
      if (!n || !n.items || n.items.length === 0) {
        return '<div class="card"><h2>' + title + '</h2><p class="unavailable">No stories available right now</p></div>';
      }
      // Photo-card grid, matching the What's On feed — Cornwall Live's RSS
      // carries a thumbnail per story (see news.js), so this no longer
      // needs to fall back to a plain text list the way it used to.
      const cards = n.items.slice(0, 15).map(i => {
        const img = i.image
          ? '<img class="feed-card-img" src="' + i.image + '" alt="" loading="lazy" />'

          + img
          + '<div class="feed-card-body">'
          + '<div class="feed-card-title">' + i.title + '</div>'
          + '</div></a>';
      }).join('');
      return '<div class="card"><h2>' + title + '</h2><div class="feed-grid">' + cards + '</div></div>';
    }

    function renderSportDetail(s) {
      const title = '⚽ Cornwall Sport';
      if (!s || !s.items || s.items.length === 0) {
        return '<div class="card"><h2>' + title + '</h2><p class="unavailable">No sport stories available right now</p></div>';
      }
      const cards = s.items.slice(0, 15).map(i => {
        const img = i.image
          ? '<img class="feed-card-img" src="' + i.image + '" alt="" loading="lazy" />'

        return '<a class="feed-card" href="' + i.link + '" target="_blank">'
          + img
          + '<div class="feed-card-body">'
          + '<div class="feed-card-title">' + i.title + '</div>'
          + '</div></a>';
      }).join('');
      return '<div class="card"><h2>' + title + '</h2><div class="feed-grid">' + cards + '</div></div>';
    }

    function renderCouncilNewsDetail(cn) {
      const banner = '<img class="card-banner" src="/images/council-news.jpg" alt="" />';
      const title = '🏛️ Cornwall Council News';
      if (!cn || !cn.items || cn.items.length === 0) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">No council news available right now</p></div>';
      }
      const cards = cn.items.slice(0, 15).map(i => {
        const img = i.image
          ? '<img class="feed-card-img" src="' + i.image + '" alt="" loading="lazy" />'

        return '<a class="feed-card" href="' + i.link + '" target="_blank">'
          + img
          + '<div class="feed-card-body">'
          + '<div class="feed-card-title">' + i.title + '</div>'
          + '</div></a>';
      }).join('');

    function trainStatusMarkup(s) {
      if (s.isCancelled) {
        return '<span class="train-status cancelled">Cancelled' + (s.cancelReason ? ' — ' + s.cancelReason : '') + '</span>';
      }
      if (s.expected && s.expected !== 'On time' && s.expected !== s.scheduledTime) {
        return '<span class="train-status delayed">Exp ' + s.expected + (s.delayReason ? ' — ' + s.delayReason : '') + '</span>';
      }
      return '<span class="train-status on-time">On time</span>';
    }

    function renderTrainsDetail(t) {
      const title = '🚆 Train Times';
      const state = unavailableState(title, t);
      if (state) return state;

      const banner = '<img class="card-banner" src="/images/trains.jpg" alt="" />';
      const subtitle = t.station
        ? '<p class="section-subtitle">' + t.station.name + ' station (' + t.station.crs + ')' + (t.station.distanceKm != null ? ' — ' + t.station.distanceKm + 'km away' : '') + '</p>'
        : '';
      const disruption = (t.disruptionMessages && t.disruptionMessages.length)
        ? '<div class="disruption-banner">' + t.disruptionMessages.join('<br>') + '</div>'
        : '';

      if (!t.services || t.services.length === 0) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2>' + subtitle + disruption + '<p class="unavailable">No departures listed right now</p></div>';
      }
      const rows = t.services.slice(0, 15).map(s => {
        return '<div class="train-row">'
          + '<div><span class="train-time">' + (s.scheduledTime || '--:--') + '</span> '
          + '<span class="train-dest">to ' + (s.destination || 'Unknown') + '</span>'
          + (s.platform ? '<div class="train-meta">Platform ' + s.platform + (s.operator ? ' · ' + s.operator : '') + '</div>' : (s.operator ? '<div class="train-meta">' + s.operator + '</div>' : ''))
          + '</div>'
          + trainStatusMarkup(s)
          + '</div>';
      }).join('');
      return '<div class="card">' + banner + '<h2>' + title + '</h2>' + subtitle + disruption + rows + '</div>';
    }

    function overflowStatusClass(status) {
      if (status === 1) return 'discharging';
      if (status === 0) return 'not-discharging';
      return 'offline';
    }

    function formatOverflowTime(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function renderStormOverflowsDetail(so) {
      const banner = '<img class="card-banner" src="/images/storm-overflow.jpg" alt="" />';
      const title = '💧 Storm Overflows';
      if (!so || so.unavailable || !so.outfalls || so.outfalls.length === 0) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">No storm overflow data available right now</p></div>';
      }
      const summary = '<p class="section-subtitle">' + so.dischargingCount + ' of ' + so.outfalls.length + ' Cornwall outfalls currently discharging · South West Water, near real-time</p>';
      const anyLocated = so.outfalls.some(o => o.lat != null && o.lon != null);
      const mapBlock = anyLocated
        ? '<div id="stormOverflowMap"></div><p class="map-legend">🔴 discharging · 🟢 not discharging · ⚪ offline / no data — click an outfall below to jump to it</p>'
        : '';
      // Indexed to match initStormOverflowMap's own marker array exactly
      // (same source array, same order), same click-to-focus pattern as
      // traffic and wildlife above.
      const items = so.outfalls.map((o, idx) => {
        const cls = overflowStatusClass(o.status);
        const hasCoords = o.lat != null && o.lon != null;
        const rowCls = 'overflow-item' + (hasCoords ? ' clickable' : '');
        const onclick = hasCoords ? ' onclick="focusStormOverflow(' + idx + ')"' : '';
        const pinLink = hasCoords ? ' <span class="traffic-item-link">📍 Show on map</span>' : '';
        const timing = o.status === 1 && o.latestEventStart
          ? 'Started discharging ' + formatOverflowTime(o.latestEventStart)
          : (o.latestEventEnd ? 'Last discharge ended ' + formatOverflowTime(o.latestEventEnd) : 'No recent discharge on record');
        const mapLink = hasCoords
          ? ' <a href="https://www.google.com/maps?q=' + o.lat + ',' + o.lon + '" target="_blank">View location</a>'
          : '';
        return '<div class="' + rowCls + '"' + onclick + '>'
          + '<span class="overflow-status-badge ' + cls + '">' + o.statusLabel + '</span>'
          + '<span class="overflow-watercourse">' + (o.waterCourse || o.id || 'Unnamed outfall') + '</span>'
          + pinLink
          + '<div class="overflow-meta">' + timing + mapLink + '</div>'
          + '</div>';
      }).join('');
      return '<div class="card">' + banner + '<h2>' + title + '</h2>' + summary + mapBlock + items + '</div>';
    }

    // Same Leaflet setup as initWildlifeMap — every outfall already comes
    // with a lat/lon from South West Water's own feed, so points on a map
    // straight away, colour-coded to match the status badges in the list.
    function initStormOverflowMap(so) {
      const mapEl = document.getElementById('stormOverflowMap');
      if (!mapEl) return;
      if (typeof L === 'undefined') {
        mapEl.outerHTML = '<p class="unavailable">Map could not load (Leaflet failed to load from its CDN) — the outfall list below is still live.</p>';
        return;
      }
      if (stormOverflowMapInstance) { stormOverflowMapInstance.remove(); stormOverflowMapInstance = null; }

      const outfalls = so && so.outfalls ? so.outfalls : [];
      const located = outfalls.filter(o => o.lat != null && o.lon != null);
      const center = located.length ? { lat: located[0].lat, lon: located[0].lon } : { lat: 50.2632, lon: -5.0510 };

      const map = L.map('stormOverflowMap').setView([center.lat, center.lon], located.length ? 10 : 9);
      stormOverflowMapInstance = map;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);

      const colors = { 1: { color: '#b91c1c', fill: '#ef4444' }, 0: { color: '#15803d', fill: '#22c55e' } };
      const offlineColor = { color: '#6b7280', fill: '#9ca3af' };

      stormOverflowMapMarkers = [];
      outfalls.forEach((o, idx) => {
        if (o.lat == null || o.lon == null) return;
        const c = colors[o.status] || offlineColor;
        const label = '<strong>' + o.statusLabel + '</strong><br>' + (o.waterCourse || o.id || '');
        const marker = L.circleMarker([o.lat, o.lon], { radius: 7, color: c.color, fillColor: c.fill, fillOpacity: 0.85 }).addTo(map).bindPopup(label);
        marker.on('mouseover', () => marker.openPopup());
        marker.on('mouseout', () => marker.closePopup());
        stormOverflowMapMarkers[idx] = marker;
      });

      if (located.length > 1) {
        const bounds = L.latLngBounds(located.map(o => [o.lat, o.lon]));
        map.fitBounds(bounds, { padding: [24, 24], maxZoom: 13 });
      }
    }

    function focusStormOverflow(idx) {
      if (!stormOverflowMapInstance) return;
      const marker = stormOverflowMapMarkers[idx];
      if (!marker) return;
      stormOverflowMapInstance.setView(marker.getLatLng(), 13, { animate: true });
      marker.openPopup();
      document.getElementById('stormOverflowMap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function warningSeverityClass(level) {
      if (level === 1 || level === 2) return 'severe';
      if (level === 3) return 'alert';
      return 'ended';
    }

    function formatShortDateTime(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function renderFloodMonitoringDetail(fm) {
      const banner = '<img class="card-banner" src="/images/river-levels.jpg" alt="" />';
      const title = '🌧️ River & Sea Levels';
      if (!fm || fm.unavailable) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">Unavailable right now</p></div>';
      }
      const activeWarnings = (fm.warnings || []).filter(w => w.severityLevel !== 4);
      const warningsBlock = activeWarnings.length
        ? activeWarnings.map(w => {
            return '<div class="flood-warning ' + warningSeverityClass(w.severityLevel) + '">'
              + '<div class="flood-warning-title">' + w.severity + (w.isTidal ? ' (tidal/coastal)' : '') + '</div>'
              + '<div class="flood-warning-desc">' + (w.description || '') + '</div>'
              + (w.message ? '<div class="flood-warning-message">' + w.message + '</div>' : '')
              + '</div>';
          }).join('')
        : '<p class="section-subtitle">No flood warnings or alerts in force for Cornwall right now</p>';

      const stations = fm.stations || [];
      const stationRows = stations.length
        ? stations.map(s => {
            const value = s.latestValue != null ? s.latestValue + (s.unitName ? s.unitName : 'm') : 'No reading';
            const when = formatShortDateTime(s.latestDateTime);
            return '<div class="level-row">'
              + '<div><span class="level-label">' + s.label + '</span>'
              + (s.isTidal ? ' <span class="level-tidal-badge">Tidal</span>' : '')
              + (s.town ? '<div class="level-meta">' + s.town + '</div>' : '')
              + '</div>'
              + '<div class="level-value">' + value + (when ? '<div class="level-meta">' + when + '</div>' : '') + '</div>'
              + '</div>';
          }).join('')
        : '<p class="unavailable">No nearby level stations found</p>';

      return '<div class="card">' + banner + '<h2>' + title + '</h2>'
        + warningsBlock
        + '<h3 class="subhead">Nearby water levels</h3>'
        + stationRows
        + '</div>';
    }

    // Each site's live classification and pollution-risk data comes from
    // the Environment Agency's own official embeddable widget, loaded
    // straight into the visitor's browser as an iframe — not fetched by
    // this app's server. That's a deliberate choice, not a shortcut: the
    // EA's Linked Data API sits behind a gateway that blocks server-to-
    // server requests to this one sub-service with a bare 403 (see
    // bathingWater.js for the full story), so re-fetching and re-drawing
    // this data ourselves kept breaking. The widget is the EA's own
    // display, always current, and immune to that block since it's the
    // visitor loading it, not us.
    function renderBathingWaterDetail(bw) {
      const banner = '<img class="card-banner" src="/images/bathing-water.jpg" alt="" />';
      const title = '🏖️ Bathing Water Quality';
      if (!bw || bw.unavailable || !bw.sites || bw.sites.length === 0) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">No bathing water data available right now' + (bw && bw.error ? ' (' + bw.error + ')' : '') + '</p></div>';
      }
      const items = bw.sites.map(s => {
        const safeName = s.name.replace(/"/g, '&quot;');
        return '<div class="bw-widget-item" data-name="' + s.name.toLowerCase() + '">'
          + '<iframe loading="lazy" scrolling="no" frameborder="0" src="' + s.widgetUrl + '" title="' + safeName + ' bathing water quality" style="width:100%;height:292px;border:0;"></iframe>'
          + '</div>';
      }).join('');
      return '<div class="card">' + banner + '<h2>' + title + '</h2>'
        + '<p class="section-subtitle">Live widgets straight from the Environment Agency — official classifications and any current pollution-risk warnings for every designated bathing water in Cornwall.</p>'
        + '<input type="text" class="bw-search" placeholder="Search ' + bw.sites.length + ' Cornwall beaches…" oninput="filterBathingWaterWidgets(this.value)">'
        + '<div class="bw-widget-grid" id="bwWidgetGrid">' + items + '</div>'
        + '</div>';
    }

    function filterBathingWaterWidgets(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('#bwWidgetGrid .bw-widget-item').forEach(el => {
        el.hidden = q.length > 0 && !el.dataset.name.includes(q);
      });
    }

    // ── Business Directory (Phase 3) — public, no sign-in required. A
    // fresh GET /api/directory on every open/search/filter rather than
    // dashboardData, since this is independent of the weather/traffic/etc.
    // aggregation and needs its own query params. Managing your OWN listing
    // (create/edit/Feature) lives in the account panel further down, since
    // that needs the signed-in user's session the same way saved locations
    // and the digest do. ─────────────────────────────────────────────────
    let directoryFilters = { q: '', category: '' };

    // Fetched once and memoized — the fixed category list barely ever
    // changes, so there's no reason to re-fetch it every time the
    // directory or the "list your business" form is opened. Both use this
    // exact same list (server-side source of truth: lib/businessCategories.js)
    // so a category can never drift into free text again.
    let businessCategoriesPromise = null;
    function getBusinessCategories() {
      if (!businessCategoriesPromise) {
        businessCategoriesPromise = fetch('/api/directory/categories')
          .then((r) => r.json())
          .then((d) => (d && d.categories) || [])
          .catch(() => []);
      }
      return businessCategoriesPromise;
    }

    async function renderDirectoryDetail() {
      const panel = document.getElementById('detailPanel');
      const backBtn = '<button class="back-btn" onclick="closeDetail()">← Back</button>';
      panel.innerHTML = backBtn + '<div class="card"><h2>🏪 Business Directory</h2><p class="unavailable">Loading…</p></div>';

      let data;
      let categories = [];
      try {
        const params = new URLSearchParams();
        if (directoryFilters.q) params.set('q', directoryFilters.q);
        if (directoryFilters.category) params.set('category', directoryFilters.category);
        if (currentLocation) { params.set('lat', currentLocation.lat); params.set('lon', currentLocation.lon); }
        const [res, cats] = await Promise.all([
          fetch('/api/directory' + (params.toString() ? '?' + params.toString() : '')),
          getBusinessCategories(),
        ]);
        data = await res.json();
        categories = cats;
      } catch (err) {
        data = { configured: true, businesses: [], error: err.message };
      }

      panel.innerHTML = backBtn + renderDirectoryCard(data, categories);
      // Re-focus the search box and put the cursor back at the end after a
      // re-render, so typing a search term doesn't feel like it keeps
      // losing focus after every keystroke-triggered refresh.
      const input = document.getElementById('directorySearchInput');
      if (input && document.activeElement !== input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    let directorySearchTimer = null;
    function onDirectorySearchInput(value) {
      directoryFilters.q = value;
      clearTimeout(directorySearchTimer);
      // Debounced rather than firing a request on every keystroke — same
      // "don't hammer the API while someone's still typing" idea as any
      // live-search box.
      directorySearchTimer = setTimeout(renderDirectoryDetail, 350);
    }
    function onDirectoryCategoryChange(value) {
      directoryFilters.category = value;
      renderDirectoryDetail();
    }

    // Reviews are shown inline, one directory row at a time (expanding a
    // second closes the first — expandedReviewsFor holds at most one id) —
    // simpler than a separate per-business detail page, and consistent with
    // how this directory already re-renders the whole list on every filter
    // change rather than patching individual rows.
    async function toggleReviews(businessId) {
      if (expandedReviewsFor === businessId) {
        expandedReviewsFor = null;
        renderDirectoryDetail();
        return;
      }
      expandedReviewsFor = businessId;
      await loadReviewsFor(businessId);
      renderDirectoryDetail();
    }

    // Public reviews + average (routes/directory.js) are fetched regardless
    // of sign-in; "my review" (routes/reviews.js, requires auth) is only
    // fetched when someone's actually signed in, so a logged-out visitor can
    // still read reviews and just doesn't see the leave-a-review form.
    async function loadReviewsFor(businessId, force) {
      if (reviewsCache[businessId] && !force) return;
      let reviews = [], avgRating = null, reviewCount = 0, myReview = null, isSignedIn = false;
      try {
        const res = await fetch('/api/directory/' + businessId + '/reviews');
        const data = await res.json();
        reviews = (data && data.reviews) || [];
        avgRating = data && data.avgRating;
        reviewCount = (data && data.reviewCount) || 0;
      } catch (e) {}
      if (sb) {
        try {
          const { data: { session } } = await sb.auth.getSession();
          if (session) {
            isSignedIn = true;
            const mine = await authedFetch('/api/reviews/' + businessId + '/mine');
            myReview = mine && mine.review;
          }
        } catch (e) {}
      }
      reviewsCache[businessId] = { reviews, avgRating, reviewCount, myReview, isSignedIn };
    }

    function renderReviewsPanel(businessId) {
      const cache = reviewsCache[businessId];
      if (!cache) return '<p class="account-note">Loading reviews…</p>';
      const { reviews, myReview } = cache;
      const reviewRows = reviews.length
        ? reviews.map((r) => {
            const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
            const date = new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            return '<div class="review-row">'
              + '<div class="review-row-top"><span class="review-row-stars">' + stars + '</span><span class="review-row-date">' + date + '</span></div>'
              + (r.comment ? '<p class="review-row-comment">' + r.comment + '</p>' : '')
              + (r.reply ? '<div class="review-row-reply"><strong>Business reply:</strong> ' + r.reply + '</div>' : '')
              + '</div>';
          }).join('')
        : '<p class="account-note">No reviews yet — be the first!</p>';
      const myForm = !cache.isSignedIn
        ? '<p class="account-note">Sign in to leave a review.</p>'
        : (
          '<div class="review-form">'
          + '<label>' + (myReview ? 'Update your review' : 'Leave a review') + '</label>'
          + '<select id="reviewRating-' + businessId + '">'
          + [5, 4, 3, 2, 1].map((n) => '<option value="' + n + '"'
            + (myReview ? (myReview.rating === n ? ' selected' : '') : (n === 5 ? ' selected' : ''))
            + '>' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</option>').join('')
          + '</select>'
          + '<textarea id="reviewComment-' + businessId + '" placeholder="Optional comment" rows="2">' + (myReview && myReview.comment ? myReview.comment : '') + '</textarea>'
          + '<button class="btn-primary" onclick="submitReview(\'' + businessId + '\')">' + (myReview ? 'Update review' : 'Submit review') + '</button>'
          + (myReview ? ' <button class="btn-secondary" onclick="removeMyReview(\'' + businessId + '\')" style="margin-left:8px;">Remove</button>' : '')
          + '<div id="reviewStatusMsg-' + businessId + '"></div>'
          + '</div>'
        );
      return '<div class="reviews-panel">' + reviewRows + myForm + '</div>';
    }

    async function submitReview(businessId) {
      const rating = parseInt(document.getElementById('reviewRating-' + businessId).value, 10);
      const comment = document.getElementById('reviewComment-' + businessId).value.trim();
      const status = document.getElementById('reviewStatusMsg-' + businessId);
      status.innerHTML = '<p class="account-note">Saving…</p>';
      try {
        await authedFetch('/api/reviews/' + businessId, { method: 'PUT', body: JSON.stringify({ rating, comment }) });
        await loadReviewsFor(businessId, true);
        renderDirectoryDetail();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function removeMyReview(businessId) {
      if (!confirm('Remove your review?')) return;
      try {
        await authedFetch('/api/reviews/' + businessId, { method: 'DELETE' });
        await loadReviewsFor(businessId, true);
        renderDirectoryDetail();
      } catch (err) {
        const status = document.getElementById('reviewStatusMsg-' + businessId);
        if (status) status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    function formatVoucherDate(dateStr) {
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Shared by the full Business Directory, the Days Out & Activities view,
    // and the Vouchers & Offers view — all three list the same kind of
    // `businesses` rows from routes/directory.js, just with different
    // filters applied server-side, so one row renderer covers all of them
    // rather than three near-duplicate copies drifting out of sync.
    function renderDirectoryRow(b) {
      const phoneLine = b.phone ? '<a href="tel:' + b.phone.replace(/\s+/g, '') + '">' + b.phone + '</a>' : '';
      const siteLine = b.website ? '<a href="' + b.website + '" target="_blank" rel="noopener">Website</a>' : '';
      const distLine = b.distanceKm != null ? b.distanceKm + 'km away' : null;
      const meta = [distLine, phoneLine, siteLine].filter(Boolean).join(' · ');
      const logo = b.logo_url ? '<img src="' + b.logo_url + '" alt="" class="directory-row-logo" />' : '';
      // Rating line is always a link — even with zero reviews yet — so
      // "be the first to review" is one click away right from the list,
      // rather than only reachable once someone else has already left one.
      const ratingText = b.reviewCount
        ? '★ ' + b.avgRating + ' (' + b.reviewCount + (b.reviewCount === 1 ? ' review' : ' reviews') + ')'
        : 'No reviews yet';
      const isExpanded = expandedReviewsFor === b.id;
      const ratingLine = '<p class="directory-row-meta"><a href="#" class="review-toggle-link" onclick="event.preventDefault(); toggleReviews(\'' + b.id + '\');">'
        + ratingText + (isExpanded ? ' · Hide' : ' · Show') + '</a></p>';
      const voucherBlock = b.hasVoucher
        ? '<p class="directory-row-meta" style="color: var(--accent-dark); font-weight:600;">🎟️ ' + b.voucherTitle
          + (b.voucherExpiresAt ? ' — ends ' + formatVoucherDate(b.voucherExpiresAt) : '') + '</p>'
          + (b.voucherDescription ? '<p class="directory-row-desc">' + b.voucherDescription + '</p>' : '')
        : '';
      return '<div class="directory-row">'
        + '<div class="directory-row-top">'
        + '<div style="display:flex; align-items:center; gap:10px;">' + logo
        + '<div><div class="directory-row-name">' + b.name + '</div>'
        + '<div class="directory-row-category">' + b.category + (b.postcode ? ' · ' + b.postcode : '') + '</div></div></div>'
        + (b.featured ? '<span class="featured-badge">★ Featured</span>' : '')
        + '</div>'
        + (b.description ? '<p class="directory-row-desc">' + b.description + '</p>' : '')
        + voucherBlock
        + (meta ? '<p class="directory-row-meta">' + meta + '</p>' : '')
        + ratingLine
        + (isExpanded ? renderReviewsPanel(b.id) : '')
        + '</div>';
    }

    function renderDirectoryCard(data, categories) {
      const categoryOptions = '<option value="">All categories</option>'
        + (categories || []).map((c) => '<option value="' + c.replace(/"/g, '&quot;') + '"'
          + (directoryFilters.category === c ? ' selected' : '') + '>' + c + '</option>').join('');
      const searchBar = '<div class="directory-search-bar">'
        + '<input type="text" id="directorySearchInput" placeholder="Search businesses…" value="'
        + (directoryFilters.q || '').replace(/"/g, '&quot;') + '" oninput="onDirectorySearchInput(this.value)" />'
        + '<select id="directoryCategoryInput" onchange="onDirectoryCategoryChange(this.value)">' + categoryOptions + '</select>'
        + '</div>';

      const businesses = (data && data.businesses) || [];

      let body;
      if (data && data.configured === false) {
        body = '<p class="unavailable">' + (data.message || 'Directory not set up yet') + '</p>';
      } else if (data && data.error) {
        body = '<p class="unavailable">Could not load the directory right now.</p>';
      } else if (!businesses.length) {
        body = '<p class="account-note">No businesses listed yet' + (directoryFilters.q || directoryFilters.category ? ' matching that search.' : ' — be the first!') + '</p>';
      } else {
        body = businesses.map(renderDirectoryRow).join('');
      }

      return '<div class="card"><h2>🏪 Business Directory</h2>'
        + '<p class="section-subtitle">Local businesses across Cornwall — Featured listings appear first.</p>'
        + searchBar
        + body
        + '</div>'
        + '<div class="card">'
        + '<h2>📋 Own a local business?</h2>'
        + '<p class="account-note">Add your business for free, or upgrade to Featured so you show up first.</p>'
        + '<button class="btn-primary" onclick="closeDetail(); openAccountPanel();">List your business</button>'
        + '</div>';
    }

    // ── Days Out & Activities — "things to do" for locals/visitors,
    // reusing the same businesses table/directory endpoint as the Business
    // Directory above, just pre-filtered to the "Attractions" and
    // "Activities" categories (see lib/businessCategories.js) instead of
    // offering every category. Split into two categories rather than one
    // catch-all "Days Out & Attractions" so browsing/filtering matches how
    // people actually think about it (a static attraction vs. a hands-on
    // activity) — a category filter here narrows to just one of the two,
    // same idea as the main directory's category dropdown, or leave it on
    // "Both" to see everything under this card. Attraction/activity
    // providers list themselves exactly the same way any other business
    // does, from the account panel.
    const ACTIVITIES_CATEGORIES = ['Attractions', 'Activities'];
    let activitiesFilters = { q: '', category: '' };

    async function renderActivitiesDetail() {
      const panel = document.getElementById('detailPanel');
      const backBtn = '<button class="back-btn" onclick="closeDetail()">← Back</button>';
      panel.innerHTML = backBtn + '<div class="card"><h2>🎡 Days Out & Activities</h2><p class="unavailable">Loading…</p></div>';

      let data;
      try {
        const params = new URLSearchParams();
        params.set('category', activitiesFilters.category || ACTIVITIES_CATEGORIES.join(','));
        if (activitiesFilters.q) params.set('q', activitiesFilters.q);
        if (currentLocation) { params.set('lat', currentLocation.lat); params.set('lon', currentLocation.lon); }
        const res = await fetch('/api/directory?' + params.toString());
        data = await res.json();
      } catch (err) {
        data = { configured: true, businesses: [], error: err.message };
      }

      panel.innerHTML = backBtn + renderActivitiesCard(data);
      const input = document.getElementById('activitiesSearchInput');
      if (input && document.activeElement !== input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    let activitiesSearchTimer = null;
    function onActivitiesSearchInput(value) {
      activitiesFilters.q = value;
      clearTimeout(activitiesSearchTimer);
      activitiesSearchTimer = setTimeout(renderActivitiesDetail, 350);
    }

    function onActivitiesCategoryChange(value) {
      activitiesFilters.category = value;
      renderActivitiesDetail();
    }

    function renderActivitiesCard(data) {
      const categoryOptions = '<option value="">Both</option>'
        + ACTIVITIES_CATEGORIES.map((c) => '<option value="' + c + '"'
          + (activitiesFilters.category === c ? ' selected' : '') + '>' + c + '</option>').join('');
      const searchBar = '<div class="directory-search-bar">'
        + '<input type="text" id="activitiesSearchInput" placeholder="Search things to do…" value="'
        + (activitiesFilters.q || '').replace(/"/g, '&quot;') + '" oninput="onActivitiesSearchInput(this.value)" />'
        + '<select id="activitiesCategoryInput" onchange="onActivitiesCategoryChange(this.value)">' + categoryOptions + '</select>'
        + '</div>';

      const businesses = (data && data.businesses) || [];

      let body;
      if (data && data.configured === false) {
        body = '<p class="unavailable">' + (data.message || 'Not set up yet') + '</p>';
      } else if (data && data.error) {
        body = '<p class="unavailable">Could not load activities right now.</p>';
      } else if (!businesses.length) {
        body = '<p class="account-note">No days out or activities listed yet' + (activitiesFilters.q || activitiesFilters.category ? ' matching that search.' : ' — check back soon, or list one from the account panel!') + '</p>';
      } else {
        body = businesses.map(renderDirectoryRow).join('');
      }

      return '<div class="card"><h2>🎡 Days Out & Activities</h2>'
        + '<p class="section-subtitle">Places to visit and things to do across Cornwall — Featured listings appear first.</p>'
        + searchBar
        + body
        + '</div>'
        + '<div class="card">'
        + '<h2>📋 Run an attraction or activity?</h2>'
        + '<p class="account-note">List it for free under "Attractions" or "Activities", and add a voucher too, from the account panel.</p>'
        + '<button class="btn-primary" onclick="closeDetail(); openAccountPanel();">List your business</button>'
        + '</div>';
    }

    // ── Vouchers & Offers — every listing (any category) that currently has
    // a live voucher (routes/directory.js's ?voucher=1, which also drops
    // any that have passed their expiry date). Open to everyone, not paid-
    // tier-gated — see the Cornwall Radar decision this was built against.
    let vouchersFilters = { q: '' };

    async function renderVouchersDetail() {
      const panel = document.getElementById('detailPanel');
      const backBtn = '<button class="back-btn" onclick="closeDetail()">← Back</button>';
      panel.innerHTML = backBtn + '<div class="card"><h2>🎟️ Vouchers & Offers</h2><p class="unavailable">Loading…</p></div>';

      let data;
      try {
        const params = new URLSearchParams();
        params.set('voucher', '1');
        if (vouchersFilters.q) params.set('q', vouchersFilters.q);
        if (currentLocation) { params.set('lat', currentLocation.lat); params.set('lon', currentLocation.lon); }
        const res = await fetch('/api/directory?' + params.toString());
        data = await res.json();
      } catch (err) {
        data = { configured: true, businesses: [], error: err.message };
      }

      panel.innerHTML = backBtn + renderVouchersCard(data);
      const input = document.getElementById('vouchersSearchInput');
      if (input && document.activeElement !== input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    let vouchersSearchTimer = null;
    function onVouchersSearchInput(value) {
      vouchersFilters.q = value;
      clearTimeout(vouchersSearchTimer);
      vouchersSearchTimer = setTimeout(renderVouchersDetail, 350);
    }

    function renderVouchersCard(data) {
      const searchBar = '<div class="directory-search-bar">'
        + '<input type="text" id="vouchersSearchInput" placeholder="Search offers…" value="'
        + (vouchersFilters.q || '').replace(/"/g, '&quot;') + '" oninput="onVouchersSearchInput(this.value)" />'
        + '</div>';

      const businesses = (data && data.businesses) || [];

      let body;
      if (data && data.configured === false) {
        body = '<p class="unavailable">' + (data.message || 'Not set up yet') + '</p>';
      } else if (data && data.error) {
        body = '<p class="unavailable">Could not load offers right now.</p>';
      } else if (!businesses.length) {
        body = '<p class="account-note">No offers listed right now' + (vouchersFilters.q ? ' matching that search.' : ' — check back soon.') + '</p>';
      } else {
        body = businesses.map(renderDirectoryRow).join('');
      }

      return '<div class="card"><h2>🎟️ Vouchers & Offers</h2>'
        + '<p class="section-subtitle">Discounts and offers from local businesses — free for everyone to browse.</p>'
        + searchBar
        + body
        + '</div>'
        + '<div class="card">'
        + '<h2>📋 Own a local business?</h2>'
        + '<p class="account-note">Add a voucher to your listing for free, from the account panel — any category.</p>'
        + '<button class="btn-primary" onclick="closeDetail(); openAccountPanel();">Manage your listing</button>'
        + '</div>';
    }

    // ── Account panel (Phase 1.5: sign-in, saved locations, morning
    // digest, billing) — a separate top-level panel from #app/#detailPanel
    // above, since its data (who's signed in, their own locations) has
    // nothing to do with dashboardData. Talks to Supabase directly for
    // auth (magic link) and to this project's own /api/account + /api/billing
    // routes — using the signed-in user's Supabase access token — for
    // everything else. ─────────────────────────────────────────────────────
    let sb = null;               // Supabase client, null until configured
    let publicConfig = null;     // { supabaseUrl, supabaseAnonKey } from /api/public-config
    let accountData = null;      // last-fetched /api/account/me payload
    let businessData = null;     // last-fetched /api/business/me payload's `business` (or null)
    let businessCategories = []; // last-fetched fixed category list, for the listing form's dropdown
    let passwordRecoveryMode = false; // true after arriving via a "reset your password" email link, until a new password is saved
    let businessReviews = [];    // last-fetched /api/business/reviews payload, for the account panel's "your listing" reply UI
    let expandedReviewsFor = null; // businessId of the one directory row currently showing its reviews panel, or null
    let reviewsCache = {};       // businessId -> { reviews, avgRating, reviewCount, myReview, isSignedIn }, filled by loadReviewsFor
    let adminBusinesses = null;  // last-fetched /api/admin/businesses payload, or null if this account isn't the admin (403) — see renderAdminCard
    let adminReviews = null;     // last-fetched /api/admin/reviews payload, or null if this account isn't the admin (403) — see renderAdminCard
    let alertPreferences = [];   // last-fetched /api/alerts payload — one row per (location, alert type) the consumer has set up

    async function initAccount() {
      try {
        const res = await fetch('/api/public-config');
        publicConfig = await res.json();
      } catch (e) {
        publicConfig = { supabaseUrl: null, supabaseAnonKey: null };
      }

      if (publicConfig.supabaseUrl && publicConfig.supabaseAnonKey && window.supabase) {
        sb = window.supabase.createClient(publicConfig.supabaseUrl, publicConfig.supabaseAnonKey);
        sb.auth.onAuthStateChange((event) => {
          // Fires when someone arrives via the "reset your password" email
          // link — Supabase signs them into a short-lived recovery session
          // automatically. Force the account panel open (it's usually
          // still hidden at this point, since this is a fresh page load
          // from an email link, not a click on the account button) and
          // show the "set a new password" card instead of whatever else
          // might otherwise render for a freshly-signed-in session.
          if (event === 'PASSWORD_RECOVERY') {
            passwordRecoveryMode = true;
            openAccountPanel();
            return;
          }
          // Otherwise (magic-link redirect completing, sign-in, sign-out,
          // MFA challenge verified, etc.) — simplest correct behaviour is
          // just re-rendering whatever's currently open.
          if (!document.getElementById('accountPanel').hidden) renderAccountPanel();
        });
      }

      document.getElementById('accountBtn').addEventListener('click', () => {
        const panel = document.getElementById('accountPanel');
        if (panel.hidden) openAccountPanel(); else closeAccountPanel();
      });

      // Land back on the account panel (not the dashboard) after a Stripe
      // Checkout redirect, so the new "Paid"/"Featured" status is the first
      // thing seen — covers both the consumer (?billing=) and business
      // (?businessBilling=) checkout flows, which use separate query params
      // since they're separate Stripe Prices/subscriptions (see billing.js
      // and business.js's success_url/cancel_url).
      const params = new URLSearchParams(window.location.search);
      if (params.get('billing') || params.get('businessBilling')) openAccountPanel();
    }

    function openAccountPanel() {
      document.getElementById('app').hidden = true;
      document.getElementById('accountPanel').hidden = false;
      renderAccountPanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function closeAccountPanel() {
      document.getElementById('accountPanel').hidden = true;
      document.getElementById('app').hidden = false;
    }

    // Attaches the signed-in user's Supabase access token to a request
    // against this project's own backend — every /api/account/* and
    // /api/billing/* route (other than the Stripe webhook itself) requires
    // this rather than trusting anything the client claims about who it is.
    async function authedFetch(path, options = {}) {
      if (!sb) throw new Error('Accounts are not set up on this server yet');
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('Not signed in');
      const headers = Object.assign({}, options.headers, {
        Authorization: 'Bearer ' + session.access_token,
        'Content-Type': 'application/json',
      });
      const res = await fetch(path, Object.assign({}, options, { headers }));
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
      return body;
    }

    // Same as authedFetch but for a multipart file upload (the business
    // logo) — deliberately does NOT set Content-Type itself, since the
    // browser needs to set that header with its own multipart boundary
    // string; setting it manually here would produce a malformed request.
    async function authedUpload(path, formData) {
      if (!sb) throw new Error('Accounts are not set up on this server yet');
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('Not signed in');
      const res = await fetch(path, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + session.access_token },
        body: formData,
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
      return body;
    }

    async function renderAccountPanel() {
      const panel = document.getElementById('accountPanel');
      const backBtn = '<button class="back-btn" onclick="closeAccountPanel()">← Back</button>';
      const msgSlot = '<div id="accountGlobalMsg"></div>';

      if (!sb) {
        panel.innerHTML = backBtn + '<div class="card"><h2>👤 Account</h2>'
          + '<p class="account-note">Accounts aren’t set up on this server yet.</p></div>';
        return;
      }

      // Set-a-new-password step of the "forgot password" flow takes over
      // the whole panel until it's done — checked before the normal
      // session check below since Supabase's recovery link DOES sign the
      // person in (to a short-lived recovery session), so without this
      // they'd otherwise land straight in their normal signed-in account
      // instead of being asked to actually pick a new password.
      if (passwordRecoveryMode) {
        panel.innerHTML = backBtn + msgSlot + renderPasswordRecoveryCard();
        return;
      }

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        panel.innerHTML = backBtn + msgSlot + renderLoginCard();
        return;
      }

      // MFA step-up gate. An account with a verified authenticator app
      // (see renderMfaCard below) signs in at aal1 same as anyone else —
      // Supabase separates "who are you" from "have you also proven it
      // with your second factor this session". nextLevel !== currentLevel
      // means a second factor exists and hasn't been satisfied yet, so the
      // code-entry card is shown instead of the account data itself.
      // requireAuth.js enforces the same thing server-side, so this isn't
      // just a UI nicety being relied on for security — it's what makes
      // the flow feel right, while the backend is what actually matters.
      // Checked every time the panel opens (not just right after sign-in),
      // since a browser tab can sit open with an unchallenged session.
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== aal.nextLevel) {
        panel.innerHTML = backBtn + msgSlot + renderMfaChallengeCard();
        return;
      }

      panel.innerHTML = backBtn + msgSlot + '<div class="card"><p class="account-note">Loading your account…</p></div>';
      try {
        // Consumer account, business listing and MFA factor status are all
        // independent of each other — fetched together so one slow or
        // failing call doesn't hold up the others. Business/MFA are both
        // genuinely optional (most consumers use neither), so their own
        // failure degrades to "none" rather than blocking the whole panel.
        // Admin-panel data (adminBusinessesResp/adminReviewsResp) is fetched
        // for EVERY signed-in user, not just Ady — the server-side
        // requireAdmin check (middleware/requireAdmin.js) is what actually
        // gates it, rejecting with 403 for anyone else. That 403 is caught
        // here into `null`, which is how renderAdminCard tells "not an
        // admin, don't show this card at all" apart from "admin, but
        // nothing to moderate yet".
        const [account, businessResp, categories, factorsResp, reviewsResp, adminBusinessesResp, adminReviewsResp, alertsResp] = await Promise.all([
          authedFetch('/api/account/me'),
          authedFetch('/api/business/me').catch(() => ({ business: null })),
          getBusinessCategories(),
          sb.auth.mfa.listFactors().catch(() => ({ data: { totp: [] } })),
          authedFetch('/api/business/reviews').catch(() => ({ reviews: [] })),
          authedFetch('/api/admin/businesses').catch(() => null),
          authedFetch('/api/admin/reviews').catch(() => null),
          authedFetch('/api/alerts').catch(() => ({ preferences: [] })),
        ]);
        accountData = account;
        businessData = businessResp.business;
        businessCategories = categories;
        businessReviews = reviewsResp.reviews || [];
        adminBusinesses = adminBusinessesResp ? adminBusinessesResp.businesses : null;
        adminReviews = adminReviewsResp ? adminReviewsResp.reviews : null;
        alertPreferences = alertsResp.preferences || [];
        const mfaFactors = (factorsResp && factorsResp.data && factorsResp.data.totp) || [];
        panel.innerHTML = backBtn + msgSlot + renderAccountCards(accountData, renderMfaCard(mfaFactors)) + renderBusinessCards(businessData, businessReviews) + renderAdminCard(adminBusinesses, adminReviews) + renderDangerZoneCard();
      } catch (err) {
        panel.innerHTML = backBtn + msgSlot + '<div class="card"><p class="account-error">' + err.message + '</p></div>';
      }
    }

    function showAccountError(message) {
      const slot = document.getElementById('accountGlobalMsg');
      if (slot) slot.innerHTML = '<div class="card"><p class="account-error">' + message + '</p></div>';
    }

    // Password sign-in is an ALTERNATIVE to the magic link, not a
    // replacement — both hit the same Supabase Auth user record for a
    // given email, so someone can start with a magic link and add a
    // password later (see the "Set or change your password" field in
    // renderAccountCards), or sign up with a password from the start.
    // These two bits of UI state just control which form the login card
    // shows; they reset to the default whenever the card is re-rendered
    // from scratch (e.g. after signing out).
    let loginMode = 'magiclink';   // 'magiclink' | 'password' | 'reset'
    let passwordAction = 'signin'; // 'signin' | 'signup' — only shown in password mode

    function renderLoginCard() {
      const existingEmail = document.getElementById('loginEmail');
      const emailValue = existingEmail ? existingEmail.value : '';

      let body;
      let modeToggle;
      if (loginMode === 'magiclink') {
        body = '<div class="account-field"><label>Email address</label>'
          + '<input type="email" id="loginEmail" placeholder="you@example.com" value="' + emailValue.replace(/"/g, '&quot;') + '" /></div>'
          + '<button class="btn-primary" onclick="sendMagicLink()">Send me a sign-in link</button>';
        modeToggle = '<p class="account-note" style="margin-top:14px;">Prefer a password? <a href="#" onclick="switchLoginMode(\'password\'); return false;">Use a password instead</a></p>';
      } else if (loginMode === 'reset') {
        // Supabase's own password-recovery flow: this just requests the
        // email; the actual "pick a new password" step happens after the
        // person clicks the link they're sent, handled separately by the
        // PASSWORD_RECOVERY auth event (see initAccount/renderPasswordRecoveryCard).
        body = '<p class="account-note" style="margin:0 0 10px;">We’ll email you a link to set a new password.</p>'
          + '<div class="account-field"><label>Email address</label>'
          + '<input type="email" id="loginEmail" placeholder="you@example.com" value="' + emailValue.replace(/"/g, '&quot;') + '" /></div>'
          + '<button class="btn-primary" onclick="sendPasswordReset()">Send reset link</button>';
        modeToggle = '<p class="account-note" style="margin-top:14px;"><a href="#" onclick="switchLoginMode(\'password\'); return false;">Back to sign in</a></p>';
      } else {
        const actionNote = passwordAction === 'signin'
          ? 'New here? <a href="#" onclick="switchPasswordAction(\'signup\'); return false;">Create an account</a> instead.'
          : 'Already have an account? <a href="#" onclick="switchPasswordAction(\'signin\'); return false;">Sign in</a> instead.';
        const forgotLink = passwordAction === 'signin'
          ? ' <a href="#" onclick="switchLoginMode(\'reset\'); return false;" style="margin-left:8px;">Forgot your password?</a>'
          : '';
        body = '<p class="account-note" style="margin:0 0 10px;">' + actionNote + forgotLink + '</p>'
          + '<div class="account-field"><label>Email address</label>'
          + '<input type="email" id="loginEmail" placeholder="you@example.com" value="' + emailValue.replace(/"/g, '&quot;') + '" /></div>'
          + '<div class="account-field"><label>Password</label>'
          + '<input type="password" id="loginPassword" placeholder="' + (passwordAction === 'signup' ? 'At least 6 characters' : 'Your password') + '" /></div>'
          + '<button class="btn-primary" onclick="' + (passwordAction === 'signup' ? 'signUpWithPassword()' : 'signInWithPasswordFlow()') + '">'
          + (passwordAction === 'signup' ? 'Create account' : 'Sign in') + '</button>';
        modeToggle = '<p class="account-note" style="margin-top:14px;">Prefer not to set a password? <a href="#" onclick="switchLoginMode(\'magiclink\'); return false;">Use a magic link instead</a></p>';
      }

      return '<div class="card"><h2>👤 Sign in</h2>'
        + '<p class="account-note">Sign in to save locations and set up your morning digest.</p>'
        + body
        + modeToggle
        + '<div id="loginStatus"></div>'
        + '</div>';
    }

    // Re-renders just the login card in place (used by the mode/action
    // toggle links above) rather than the full renderAccountPanel, since
    // that would re-check the session and briefly flash "Loading…" for no
    // reason — nothing about the sign-in state has actually changed yet.
    function refreshLoginCard() {
      const panel = document.getElementById('accountPanel');
      const backBtn = '<button class="back-btn" onclick="closeAccountPanel()">← Back</button>';
      const msgSlot = '<div id="accountGlobalMsg"></div>';
      panel.innerHTML = backBtn + msgSlot + renderLoginCard();
    }
    function switchLoginMode(mode) { loginMode = mode; passwordAction = 'signin'; refreshLoginCard(); }
    function switchPasswordAction(action) { passwordAction = action; refreshLoginCard(); }

    async function sendMagicLink() {
      const email = document.getElementById('loginEmail').value.trim();
      const status = document.getElementById('loginStatus');
      if (!email) { status.innerHTML = '<p class="account-error">Enter your email first</p>'; return; }
      status.innerHTML = '<p class="account-note">Sending…</p>';
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin },
      });
      status.innerHTML = error
        ? '<p class="account-error">' + error.message + '</p>'
        : '<p class="account-success">Check your email for a sign-in link.</p>';
    }

    async function sendPasswordReset() {
      const email = document.getElementById('loginEmail').value.trim();
      const status = document.getElementById('loginStatus');
      if (!email) { status.innerHTML = '<p class="account-error">Enter your email first</p>'; return; }
      status.innerHTML = '<p class="account-note">Sending…</p>';
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin,
      });
      // Same "don't reveal who's registered" behaviour as sign-up — Supabase
      // returns success here regardless of whether the email has an
      // account, so the message is worded to cover both cases honestly.
      status.innerHTML = error
        ? '<p class="account-error">' + error.message + '</p>'
        : '<p class="account-success">If that email has an account, a reset link is on its way.</p>';
    }

    async function signInWithPasswordFlow() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const status = document.getElementById('loginStatus');
      if (!email || !password) { status.innerHTML = '<p class="account-error">Enter your email and password</p>'; return; }
      status.innerHTML = '<p class="account-note">Signing in…</p>';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      // On success there's nothing to do here — the onAuthStateChange
      // listener registered in initAccount() already re-renders the panel
      // into the signed-in view. Only the failure case needs handling.
      if (error) {
        status.innerHTML = '<p class="account-error">' + (error.message === 'Invalid login credentials'
          ? 'Incorrect email or password.'
          : error.message) + '</p>';
      }
    }

    async function signUpWithPassword() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const status = document.getElementById('loginStatus');
      if (!email || !password) { status.innerHTML = '<p class="account-error">Enter your email and password</p>'; return; }
      if (password.length < 6) { status.innerHTML = '<p class="account-error">Password must be at least 6 characters</p>'; return; }
      status.innerHTML = '<p class="account-note">Creating your account…</p>';
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.origin },
      });
      if (error) {
        status.innerHTML = '<p class="account-error">' + error.message + '</p>';
        return;
      }
      // Supabase deliberately returns the same "success, check your email"
      // shape whether this email is brand new or already has an account
      // (so the response can't be used to check who's registered) — and
      // whether a session comes back immediately depends on the Supabase
      // project's "Confirm email" setting, which this app doesn't control.
      // Either way, if a session DID come back, onAuthStateChange handles
      // showing the signed-in view — this message only covers the
      // "needs confirming" case.
      if (!data.session) {
        status.innerHTML = '<p class="account-success">Check your email to confirm your account. (Already signed up? Use "Sign in" above instead.)</p>';
      }
    }

    async function signOut() {
      await sb.auth.signOut();
      // Both are per-session UI state, not something that should survive
      // into the next person who signs in on this same browser/tab: a
      // half-finished MFA enrollment (QR shown, code not yet entered), and
      // a stale "come back to set a new password" flag from a recovery
      // link that was abandoned without saving one.
      mfaEnrollment = null;
      passwordRecoveryMode = false;
      renderAccountPanel();
    }

    function renderAccountCards(a, mfaCardHtml) {
      const badgeClass = a.subscriptionStatus || 'free';
      const badgeLabel = a.isPaid ? 'Paid'
        : a.subscriptionStatus === 'past_due' ? 'Past due'
        : a.subscriptionStatus === 'canceled' ? 'Cancelled'
        : 'Free';

      const profileCard = '<div class="card"><h2>👤 ' + a.email
        + '<span class="account-status-badge ' + badgeClass + '">' + badgeLabel + '</span></h2>'
        + (a.isPaid
          ? '<button class="btn-secondary" onclick="openBillingPortal()">Manage billing</button>'
          : '<button class="btn-primary" onclick="startCheckout()">Subscribe — £2.49/month</button>')
        + ' <button class="btn-secondary" onclick="signOut()" style="margin-left:8px;">Sign out</button>'
        + '</div>';

      // Lets a magic-link-only account add a password (so future sign-ins
      // don't need an email round trip), or change one already set — same
      // field either way, since there's no reliable client-side way to
      // tell Supabase Auth "this account has no password yet" from a
      // magic-link sign-in alone (both look the same auth-provider-wise).
      const passwordCard = '<div class="card"><h2>🔒 Password</h2>'
        + '<p class="account-note">Set or change your password so you can sign in with it instead of a magic link.</p>'
        + '<div class="account-field"><label>New password</label>'
        + '<input type="password" id="newPassword" placeholder="At least 6 characters" /></div>'
        + '<button class="btn-secondary" onclick="setAccountPassword()">Save password</button>'
        + '<div id="passwordStatusMsg"></div>'
        + '</div>';

      const locationRows = a.locations.length
        ? a.locations.map((loc) => '<div class="location-row">'
            + '<div><div class="location-row-label">' + loc.label + '</div>'
            + '<div class="location-row-postcode">' + loc.postcode + '</div></div>'
            + '<button class="btn-secondary" style="margin-right:6px;" onclick="viewSavedLocation(' + loc.lat + ',' + loc.lng + ',\'' + loc.label.replace(/'/g, "\\'") + '\')">View</button>'
            + '<button class="location-row-remove" onclick="removeLocation(\'' + loc.id + '\')">Remove</button>'
            + '</div>').join('')
        : '<p class="account-note">No saved locations yet.</p>';

      const locationsCard = '<div class="card"><h2>📍 Saved locations</h2>'
        + locationRows
        + '<div class="account-field" style="margin-top:14px;"><label>Label</label><input type="text" id="newLocationLabel" placeholder="Home, Mum’s, dog walk…" /></div>'
        + '<div class="account-field"><label>Postcode or town</label><input type="text" id="newLocationPostcode" placeholder="TR1 2AB" /></div>'
        + '<button class="btn-primary" onclick="addLocation()">Add location</button>'
        + '<div id="locationStatusMsg"></div>'
        + '</div>';

      const alertCards = ALERT_TYPE_ORDER.map((type) => renderAlertTypeCard(type, a.isPaid, a.locations)).join('');

      return profileCard + passwordCard + (mfaCardHtml || '') + locationsCard + alertCards;
    }

    // ── Alert preferences — morning digest, traffic, weather, wildlife.
    // All four share one shape (routes/alerts.js): a list of saved-location
    // rows the consumer has turned this alert on for, plus a form to add
    // another. Two types need extra fields beyond a single location: the
    // digest needs a "send at" hour (needsHour), and traffic needs a SECOND
    // location — a genuine A-to-B route, not just a radius around one spot
    // (needsRoute) — plus a delay threshold.
    const ALERT_TYPE_ORDER = ['morning_digest', 'traffic_route', 'weather_warning', 'wildlife_nearby'];
    const ALERT_TYPE_META = {
      morning_digest: {
        icon: '☀️', title: 'Morning digest', needsHour: true, needsRoute: false,
        description: 'A daily email with weather, tides, traffic and more for a saved spot, sent at a time you choose.',
      },
      traffic_route: {
        icon: '🚗', title: 'Traffic alerts', needsHour: false, needsRoute: true,
        description: 'An email when a saved route (e.g. home → work) is currently running notably slower than normal because of traffic.',
      },
      weather_warning: {
        icon: '⛈️', title: 'Weather alerts', needsHour: false, needsRoute: false,
        description: 'An email when high wind, heavy rain, extreme heat/cold, or an active flood warning is flagged for a saved spot — Cornwall Radar’s own threshold check, not an official Met Office warning.',
      },
      wildlife_nearby: {
        icon: '🦊', title: 'Wildlife nearby', needsHour: false, needsRoute: false,
        description: 'An email when a species is recently logged (GBIF) near a saved spot. Not filtered by rarity — just what’s been recorded close by recently.',
      },
    };
    const DELAY_THRESHOLD_OPTIONS = [5, 10, 15, 20, 30, 45, 60];

    function formatHour(h) {
      return (h % 12 === 0 ? 12 : h % 12) + ':00 ' + (h < 12 ? 'am' : 'pm');
    }

    function renderAlertTypeCard(type, isPaid, locations) {
      const meta = ALERT_TYPE_META[type];
      if (!isPaid) {
        return '<div class="card"><h2>' + meta.icon + ' ' + meta.title + '</h2>'
          + '<p class="account-note">' + meta.description + ' Available on the paid plan.</p></div>';
      }
      const minLocations = meta.needsRoute ? 2 : 1;
      if (locations.length < minLocations) {
        const note = meta.needsRoute
          ? 'Add at least two saved locations above first (e.g. home and work), then set up a route alert here.'
          : 'Add a saved location above first, then set this up here.';
        return '<div class="card"><h2>' + meta.icon + ' ' + meta.title + '</h2>'
          + '<p class="account-note">' + note + '</p></div>';
      }

      const prefsForType = alertPreferences.filter((p) => p.alertType === type);
      // Only morning_digest (sendHour) and traffic_route (delayThresholdMinutes)
      // have an editable field — weather_warning/wildlife_nearby take no
      // config yet, so they get no Edit button at all rather than one that
      // opens a form with nothing in it.
      const rows = prefsForType.map((p) => {
        let label = p.locationLabel;
        if (meta.needsRoute) {
          label += ' → ' + (p.destinationLabel || 'unknown');
          const mins = p.config && p.config.delayThresholdMinutes;
          if (mins) label += ' (alerts at ' + mins + '+ min delay)';
        } else if (meta.needsHour && p.config && typeof p.config.sendHour === 'number') {
          label += ' at ' + formatHour(p.config.sendHour);
        }

        let editButton = '';
        let editForm = '';
        if (meta.needsRoute) {
          const currentThreshold = (p.config && p.config.delayThresholdMinutes) || 10;
          const thresholdOptions = DELAY_THRESHOLD_OPTIONS.map((m) => '<option value="' + m + '"' + (m === currentThreshold ? ' selected' : '') + '>' + m + ' min</option>').join('');
          editButton = '<button class="btn-secondary" style="margin-right:6px;" onclick="showEditAlertPref(\'' + p.id + '\')">Edit</button>';
          editForm = '<div class="account-field" id="alertEditForm-' + p.id + '" hidden>'
            + '<label>Alert when delay is at least</label><select id="alertEditThreshold-' + p.id + '">' + thresholdOptions + '</select>'
            + ' <button class="btn-primary" onclick="saveAlertPrefEdit(\'' + p.id + '\', \'' + type + '\')">Save</button>'
            + ' <button class="btn-secondary" onclick="cancelEditAlertPref(\'' + p.id + '\')">Cancel</button>'
            + '</div>';
        } else if (meta.needsHour) {
          const currentHour = (p.config && typeof p.config.sendHour === 'number') ? p.config.sendHour : 8;
          const hourOptions = Array.from({ length: 24 }, (_, h) => '<option value="' + h + '"' + (h === currentHour ? ' selected' : '') + '>' + formatHour(h) + '</option>').join('');
          editButton = '<button class="btn-secondary" style="margin-right:6px;" onclick="showEditAlertPref(\'' + p.id + '\')">Edit</button>';
          editForm = '<div class="account-field" id="alertEditForm-' + p.id + '" hidden>'
            + '<label>Send at</label><select id="alertEditHour-' + p.id + '">' + hourOptions + '</select>'
            + ' <button class="btn-primary" onclick="saveAlertPrefEdit(\'' + p.id + '\', \'' + type + '\')">Save</button>'
            + ' <button class="btn-secondary" onclick="cancelEditAlertPref(\'' + p.id + '\')">Cancel</button>'
            + '</div>';
        }

        return '<div class="location-row">'
          + '<div><div class="location-row-label">' + label + '</div>' + editForm + '</div>'
          + editButton
          + '<button class="btn-secondary" style="margin-right:6px;" onclick="toggleAlertPref(\'' + p.id + '\', ' + (!p.active) + ')">' + (p.active ? 'Turn off' : 'Turn on') + '</button>'
          + '<button class="location-row-remove" onclick="removeAlertPref(\'' + p.id + '\')">Remove</button>'
          + '</div>';
      }).join('');

      let addForm;
      if (meta.needsRoute) {
        // Both dropdowns offer every saved location (unlike the other
        // three types below) — home→work and home→gym are both valid,
        // distinct route alerts sharing the same origin, so filtering by
        // "already used" doesn't make sense here. The backend still
        // rejects an exact duplicate origin+destination pair (409).
        const locationOptions = locations.map((loc) => '<option value="' + loc.id + '">' + loc.label + '</option>').join('');
        const thresholdOptions = DELAY_THRESHOLD_OPTIONS.map((m) => '<option value="' + m + '"' + (m === 10 ? ' selected' : '') + '>' + m + ' min</option>').join('');
        addForm = '<div class="account-field"><label>From</label><select id="newAlertLocation-' + type + '">' + locationOptions + '</select></div>'
          + '<div class="account-field"><label>To</label><select id="newAlertDestination-' + type + '">' + locationOptions + '</select></div>'
          + '<div class="account-field"><label>Alert when delay is at least</label><select id="newAlertThreshold-' + type + '">' + thresholdOptions + '</select></div>'
          + '<button class="btn-primary" onclick="addAlertPref(\'' + type + '\')">Add</button>';
      } else {
        // Only offer locations that don't already have this alert type —
        // the backend enforces one-per-(location, type) too (409 on a
        // duplicate), this is just so the dropdown never offers a choice
        // that would fail.
        const usedLocationIds = new Set(prefsForType.map((p) => p.locationId));
        const availableLocations = locations.filter((loc) => !usedLocationIds.has(loc.id));
        if (!availableLocations.length) {
          addForm = '<p class="account-note">Every saved location already has this alert set up.</p>';
        } else {
          const locationOptions = availableLocations.map((loc) => '<option value="' + loc.id + '">' + loc.label + '</option>').join('');
          const hourField = meta.needsHour
            ? '<div class="account-field"><label>Send at</label><select id="newAlertHour-' + type + '">'
              + Array.from({ length: 24 }, (_, h) => '<option value="' + h + '">' + formatHour(h) + '</option>').join('')
              + '</select></div>'
            : '';
          addForm = '<div class="account-field"><label>Location</label><select id="newAlertLocation-' + type + '">' + locationOptions + '</select></div>'
            + hourField
            + '<button class="btn-primary" onclick="addAlertPref(\'' + type + '\')">Add</button>';
        }
      }

      return '<div class="card"><h2>' + meta.icon + ' ' + meta.title + '</h2>'
        + '<p class="account-note">' + meta.description + '</p>'
        + rows
        + addForm
        + '<div id="alertStatusMsg-' + type + '"></div>'
        + '</div>';
    }

    async function addAlertPref(type) {
      const meta = ALERT_TYPE_META[type];
      const locationSelect = document.getElementById('newAlertLocation-' + type);
      const status = document.getElementById('alertStatusMsg-' + type);
      if (!locationSelect || !locationSelect.value) { if (status) status.innerHTML = '<p class="account-error">Choose a location</p>'; return; }

      const config = {};
      if (meta.needsHour) {
        const hourSelect = document.getElementById('newAlertHour-' + type);
        config.sendHour = parseInt(hourSelect.value, 10);
      }
      if (meta.needsRoute) {
        const destinationSelect = document.getElementById('newAlertDestination-' + type);
        const thresholdSelect = document.getElementById('newAlertThreshold-' + type);
        if (!destinationSelect.value) { status.innerHTML = '<p class="account-error">Choose a destination</p>'; return; }
        if (destinationSelect.value === locationSelect.value) { status.innerHTML = '<p class="account-error">Origin and destination must be different</p>'; return; }
        config.destinationLocationId = destinationSelect.value;
        config.delayThresholdMinutes = parseInt(thresholdSelect.value, 10);
      }

      status.innerHTML = '<p class="account-note">Saving…</p>';
      try {
        await authedFetch('/api/alerts', {
          method: 'POST',
          body: JSON.stringify({ alertType: type, locationId: locationSelect.value, config }),
        });
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function toggleAlertPref(id, active) {

    // Shown instead of the normal account panel after someone clicks a
    // "reset your password" email link (see the PASSWORD_RECOVERY handling
