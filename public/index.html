    // ── Delete account. The one genuinely irreversible action in this
    // panel, so it gets its own visually distinct "danger zone" card at the
    // very bottom, a text-confirmation step rather than a single click, and
    // a native confirm() on top of that as a last-chance guard rail before
    // the request is actually sent. See DELETE /api/account/me for what
    // this removes: consumer profile, business listing (if any), saved
    // locations, every alert preference, any active Stripe subscription —
    // the lot, including the sign-in itself, cancelled and gone, not just
    // "hidden".
    function renderDangerZoneCard() {
      return '<div class="card" style="border-color:#f2c6c2;">'
        + '<h2 style="color:#a3271b;">⚠️ Delete account</h2>'
        + '<p class="account-note">Permanently deletes your account, any business listing, saved locations and alert settings, and cancels any active subscription. This can’t be undone.</p>'
        + '<div class="account-field"><label>Type DELETE to confirm</label>'
        + '<input type="text" id="deleteAccountConfirm" placeholder="DELETE" autocomplete="off" /></div>'
        + '<button class="btn-danger" onclick="deleteAccount()">Delete my account</button>'
        + '<div id="deleteAccountStatusMsg"></div>'
        + '</div>';
    }

    async function deleteAccount() {
      const confirmText = document.getElementById('deleteAccountConfirm').value.trim();
      const status = document.getElementById('deleteAccountStatusMsg');
      if (confirmText !== 'DELETE') {
        status.innerHTML = '<p class="account-error">Type DELETE (in capitals) into the box first</p>';
        return;
      }
      if (!confirm('This permanently deletes your account and everything in it, and cancels any active subscription. This cannot be undone. Continue?')) {
        return;
      }
      status.innerHTML = '<p class="account-note">Deleting your account…</p>';
      try {
        await authedFetch('/api/account/me', { method: 'DELETE' });
        await sb.auth.signOut();
        const panel = document.getElementById('accountPanel');
        const backBtn = '<button class="back-btn" onclick="closeAccountPanel()">← Back</button>';
        panel.innerHTML = backBtn + '<div class="card"><h2>👋 Account deleted</h2>'
          + '<p class="account-note">Your Cornwall Radar account has been permanently deleted.</p></div>';
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    // ── Two-factor authentication (TOTP via an authenticator app). Entirely
    // Supabase's own MFA support (enroll/challenge/verify/unenroll) — no
    // custom backend route needed for any of it, same as password sign-in.
    // requireAuth.js is what actually enforces the "must be aal2" rule on
    // every API call; everything here is just the UI for setting it up.
    let mfaEnrollment = null; // { factorId, qrCode, secret } while a fresh enrollment awaits its confirm code

    function renderMfaCard(factors) {
      const verified = (factors || []).filter((f) => f.status === 'verified');

      if (mfaEnrollment) {
        // Supabase's totp.qr_code comes back as a data: URI wrapping RAW,
        // unescaped SVG markup (see mfa.enroll()'s own docs) — it's built
        // for React's src={...} (a real attribute value, no HTML parsing
        // involved), not for dropping into an HTML string like everything
        // else here. The `"` characters inside that SVG's own attributes
        // (viewBox="...", etc.) close the img tag's src="..." early if
        // left unescaped, which is what showed up as raw broken markup on
        // the page instead of an image.
        const qrCodeSrc = mfaEnrollment.qrCode.replace(/"/g, '&quot;');
        return '<div class="card"><h2>🔐 Two-factor authentication</h2>'
          + '<p class="account-note">Scan this with an authenticator app (Google Authenticator, Authy, 1Password, etc.), then enter the 6-digit code it shows.</p>'
          + '<img src="' + qrCodeSrc + '" alt="QR code" style="display:block; width:180px; height:180px; margin:10px 0; border:1px solid var(--border); border-radius:var(--radius-sm);" />'
          + '<p class="account-note">Can’t scan it? Enter this key manually instead: <code>' + mfaEnrollment.secret + '</code></p>'
          + '<div class="account-field"><label>Code from your app</label>'
          + '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="mfaEnrollCode" placeholder="123456" /></div>'
          + '<button class="btn-primary" onclick="confirmMfaEnrollment()">Verify &amp; enable</button>'
          + ' <button class="btn-secondary" onclick="cancelMfaEnrollment()" style="margin-left:8px;">Cancel</button>'
          + '<div id="mfaStatusMsg"></div>'
          + '</div>';
      }

      if (verified.length) {
        return '<div class="card"><h2>🔐 Two-factor authentication</h2>'
          + '<p class="account-note">On — your authenticator app is required at sign-in, on top of your password or magic link.</p>'
          + '<button class="btn-secondary" onclick="disableMfa(\'' + verified[0].id + '\')">Turn off</button>'
          + '<div id="mfaStatusMsg"></div>'
          + '</div>';
      }

      return '<div class="card"><h2>🔐 Two-factor authentication</h2>'
        + '<p class="account-note">Off. Add an authenticator app for an extra check at sign-in.</p>'
        + '<button class="btn-secondary" onclick="startMfaEnrollment()">Set up two-factor authentication</button>'
        + '<div id="mfaStatusMsg"></div>'
        + '</div>';
    }

    async function startMfaEnrollment() {
      const status = document.getElementById('mfaStatusMsg');
      try {
        const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp' });
        if (error) throw error;
        mfaEnrollment = { factorId: data.id, qrCode: data.totp.qr_code, secret: data.totp.secret };
        renderAccountPanel();
      } catch (err) {
        if (status) status.innerHTML = '<p class="account-error">' + (err.message || 'Could not start setup') + '</p>';
      }
    }

    async function cancelMfaEnrollment() {
      // Un-enroll the half-finished factor rather than just clearing local
      // state — Supabase caps how many factors a user can have, so an
      // abandoned unverified one left behind would eventually get in the
      // way of a real attempt.
      if (mfaEnrollment) {
        await sb.auth.mfa.unenroll({ factorId: mfaEnrollment.factorId }).catch(() => {});
      }
      mfaEnrollment = null;
      renderAccountPanel();
    }

    async function confirmMfaEnrollment() {
      const code = document.getElementById('mfaEnrollCode').value.trim();
      const status = document.getElementById('mfaStatusMsg');
      if (!code) { status.innerHTML = '<p class="account-error">Enter the 6-digit code</p>'; return; }
      status.innerHTML = '<p class="account-note">Verifying…</p>';
      try {
        const { data: challenge, error: challengeErr } = await sb.auth.mfa.challenge({ factorId: mfaEnrollment.factorId });
        if (challengeErr) throw challengeErr;
        const { error: verifyErr } = await sb.auth.mfa.verify({
          factorId: mfaEnrollment.factorId,
          challengeId: challenge.id,
          code,
        });
        if (verifyErr) throw verifyErr;
        mfaEnrollment = null;
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + (err.message || 'Invalid code — try again') + '</p>';
      }
    }

    async function disableMfa(factorId) {
      const status = document.getElementById('mfaStatusMsg');
      status.innerHTML = '<p class="account-note">Turning off…</p>';
      const { error } = await sb.auth.mfa.unenroll({ factorId });
      if (error) {
        status.innerHTML = '<p class="account-error">' + error.message + '</p>';
        return;
      }
      renderAccountPanel();
    }

    // Shown instead of the normal account panel when a signed-in session
    // hasn't yet cleared its second factor (see the aal check in
    // renderAccountPanel) — sign-in itself succeeded, but nothing account-
    // related loads until this passes, matching what requireAuth.js
    // enforces server-side.
    function renderMfaChallengeCard() {
      return '<div class="card"><h2>🔐 Two-factor verification</h2>'
        + '<p class="account-note">Enter the 6-digit code from your authenticator app.</p>'
        + '<div class="account-field"><label>Code</label>'
        + '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="mfaChallengeCode" placeholder="123456" /></div>'
        + '<button class="btn-primary" onclick="verifyMfaChallenge()">Verify</button>'
        + ' <button class="btn-secondary" onclick="signOut()" style="margin-left:8px;">Sign out</button>'
        + '<div id="mfaChallengeStatus"></div>'
        + '</div>';
    }

    async function verifyMfaChallenge() {
      const code = document.getElementById('mfaChallengeCode').value.trim();
      const status = document.getElementById('mfaChallengeStatus');
      if (!code) { status.innerHTML = '<p class="account-error">Enter the 6-digit code</p>'; return; }
      status.innerHTML = '<p class="account-note">Verifying…</p>';
      try {
        const { data: factors, error: factorsErr } = await sb.auth.mfa.listFactors();
        if (factorsErr) throw factorsErr;
        const factor = (factors.totp || [])[0];
        if (!factor) throw new Error('No authenticator app found on this account');
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
        if (error) throw error;
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + (err.message || 'Invalid code — try again') + '</p>';
      }
    }

    // ── Business directory: manage YOUR OWN listing (see routes/business.js).
    // Same signed-in session as the rest of this panel — a person can be a
    // consumer, a business, or both, with one login.
    function renderBusinessCards(business, reviews) {
      const badgeClass = business ? (business.subscription_status || 'free') : 'free';
      const badgeLabel = business && business.subscription_status === 'active' ? 'Featured'
        : business && business.subscription_status === 'past_due' ? 'Past due'
        : business && business.subscription_status === 'canceled' ? 'Cancelled'
        : business ? 'Free listing' : '';
      const headerBadge = business ? '<span class="account-status-badge ' + badgeClass + '">' + badgeLabel + '</span>' : '';

      const billingBtn = !business ? ''
        : business.subscription_status === 'active'
          ? '<button class="btn-secondary" onclick="openBusinessBillingPortal()">Manage billing</button>'
          : '<button class="btn-primary" onclick="startBusinessCheckout()">Upgrade to Featured — £4.99/month</button>';
      const removeBtn = business
        ? ' <button class="btn-secondary" style="margin-left:8px;" onclick="removeBusinessListing()">Remove listing</button>'

      // Logo upload only makes sense once a listing row exists (it just
      // updates that row's logo_url) — same "create it, then enhance it"
      // order as upgrading to Featured, so this block only renders when
      // `business` is already set.
      const logoBlock = !business ? '' : (
        '<div class="account-field"><label>Logo (optional)</label>'
        + '<p class="account-note">Square image works best, e.g. 512×512px, cropped tight to the logo with little empty space around it. PNG, JPEG or WebP, up to 2MB.</p>'
        + (business.logo_url ? '<img src="' + business.logo_url + '" alt="" style="display:block; width:64px; height:64px; object-fit:contain; background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; box-sizing:border-box; padding:4px;" />' : '')
        + '<input type="file" id="bizLogoFile" accept="image/png,image/jpeg,image/webp" />'
        + '<button class="btn-secondary" style="margin-top:8px;" onclick="uploadBusinessLogo()">' + (business.logo_url ? 'Replace logo' : 'Upload logo') + '</button>'
        + '<div id="bizLogoStatusMsg"></div>'
        + '</div>'
      );

      return '<div class="card"><h2>🏪 Your business listing' + headerBadge + '</h2>'
        + (business
          ? '<p class="account-note">Visible in the public Business Directory right now. Editing below updates it instantly.</p>'
          : '<p class="account-note">Free to list — fill this in to appear in the Business Directory.</p>')
        + '<div class="account-field"><label>Business name</label><input type="text" id="bizName" value="' + esc(business && business.name) + '" placeholder="The Cornish Bakery" /></div>'
        + '<div class="account-field"><label>Category</label><select id="bizCategory">'
        + '<option value="">Choose a category…</option>'
        + businessCategories.map((c) => '<option value="' + esc(c) + '"'
          + (business && business.category === c ? ' selected' : '') + '>' + c + '</option>').join('')
        + '</select></div>'
        + '<div class="account-field"><label>Postcode or town</label><input type="text" id="bizPostcode" value="' + esc(business && business.postcode) + '" placeholder="TR1 2AB" /></div>'
        + '<div class="account-field"><label>Description (optional)</label><input type="text" id="bizDescription" value="' + esc(business && business.description) + '" placeholder="What you do, in a sentence" /></div>'
        + '<div class="account-field"><label>Phone (optional)</label><input type="text" id="bizPhone" value="' + esc(business && business.phone) + '" placeholder="01872 000000" /></div>'
        + '<div class="account-field"><label>Website (optional)</label><input type="text" id="bizWebsite" value="' + esc(business && business.website) + '" placeholder="https://…" /></div>'
        + '<div class="account-field"><label>Voucher / offer (optional)</label>'
        + '<p class="account-note">Shown to everyone on the Vouchers & Offers page, and as a badge on your listing. Leave the title blank to remove it.</p>'
        + '<input type="text" id="bizVoucherTitle" value="' + esc(business && business.voucher_title) + '" placeholder="e.g. 20% off entry" style="margin-bottom:6px;" />'
        + '<input type="text" id="bizVoucherDescription" value="' + esc(business && business.voucher_description) + '" placeholder="Details, e.g. how to redeem (optional)" style="margin-bottom:6px;" />'
        + '<label style="font-weight:400; font-size:0.82rem;">Ends on (optional)</label>'
        + '<input type="date" id="bizVoucherExpiresAt" value="' + esc(business && business.voucher_expires_at) + '" />'
        + '</div>'
        + logoBlock
        + '<button class="' + (business ? 'btn-secondary' : 'btn-primary') + '" onclick="saveBusinessListing()">' + (business ? 'Save changes' : 'Create listing') + '</button>'
        + (business ? ' ' + billingBtn + removeBtn : '')
        + '<div id="businessStatusMsg"></div>'
        + '</div>'
        + (business ? renderOwnerReviewsCard(reviews || []) : '');
    }

    // Reviews on the signed-in business's own listing — read-only for the
    // review/rating itself (only the reviewer can change that, via
    // routes/reviews.js), but the reply is the owner's to write, edit or
    // remove (routes/business.js). Reviewer identity is never shown here
    // either, same as the public directory view — sign-in-to-review is meant
    // to curb spam, not to make people's identities visible to businesses.
    let ownerReviewsById = {}; // reviewId -> raw review row, refreshed on every render — lets editReviewReply prefill from data instead of re-parsing rendered HTML
    function renderOwnerReviewsCard(reviews) {
      ownerReviewsById = {};
      reviews.forEach((r) => { ownerReviewsById[r.id] = r; });
      if (!reviews.length) {
        return '<div class="card"><h2>💬 Reviews on your listing</h2>'
          + '<p class="account-note">No reviews yet.</p></div>';
      }
      const rows = reviews.map((r) => {
        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const date = new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        const replyBlock = r.reply
          ? '<div class="review-row-reply"><strong>Your reply:</strong> ' + r.reply + '</div>'
            + '<button class="btn-secondary" onclick="editReviewReply(\'' + r.id + '\')" style="margin-top:6px;">Edit reply</button>'
            + ' <button class="btn-secondary" onclick="removeReviewReply(\'' + r.id + '\')" style="margin-left:8px; margin-top:6px;">Remove reply</button>'
          : '<div class="review-form" id="reviewReplyForm-' + r.id + '" hidden>'
            + '<textarea id="reviewReplyText-' + r.id + '" placeholder="Write a public reply…" rows="2"></textarea>'
            + '<button class="btn-primary" onclick="saveReviewReply(\'' + r.id + '\')">Post reply</button>'
            + '</div>'
            + '<button class="btn-secondary" id="reviewReplyToggle-' + r.id + '" onclick="showReviewReplyForm(\'' + r.id + '\')" style="margin-top:6px;">Reply</button>';
        return '<div class="review-row">'
          + '<div class="review-row-top"><span class="review-row-stars">' + stars + '</span><span class="review-row-date">' + date + '</span></div>'
          + (r.comment ? '<p class="review-row-comment">' + r.comment + '</p>' : '')
          + replyBlock
          + '<div id="reviewReplyStatus-' + r.id + '"></div>'
          + '</div>';
      }).join('');
      return '<div class="card"><h2>💬 Reviews on your listing</h2>' + rows + '</div>';
    }

    function showReviewReplyForm(reviewId) {
      const form = document.getElementById('reviewReplyForm-' + reviewId);
      const toggle = document.getElementById('reviewReplyToggle-' + reviewId);
      if (form) form.hidden = false;
      if (toggle) toggle.hidden = true;
    }

    async function saveReviewReply(reviewId) {
      const reply = document.getElementById('reviewReplyText-' + reviewId).value.trim();
      const status = document.getElementById('reviewReplyStatus-' + reviewId);
      if (!reply) { status.innerHTML = '<p class="account-error">Write a reply first</p>'; return; }
      status.innerHTML = '<p class="account-note">Posting…</p>';
      try {
        await authedFetch('/api/business/reviews/' + reviewId + '/reply', { method: 'PUT', body: JSON.stringify({ reply }) });
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    // "Edit" just re-opens a reply form pre-filled with the current text
    // (from ownerReviewsById, filled on the last render — not re-parsed out
    // of the rendered HTML) and reuses saveReviewReply to overwrite it —
    // routes/business.js's PUT endpoint replaces the reply rather than
    // versioning it, so editing and first-writing are the same call.
    function editReviewReply(reviewId) {
      const review = ownerReviewsById[reviewId];
      const current = (review && review.reply) || '';
      const card = document.getElementById('reviewReplyStatus-' + reviewId).closest('.review-row');
      const replyDiv = card.querySelector('.review-row-reply');
      replyDiv.outerHTML =
        '<div class="review-form" id="reviewReplyForm-' + reviewId + '">'
        + '<textarea id="reviewReplyText-' + reviewId + '" placeholder="Write a public reply…" rows="2">' + current + '</textarea>'
        + '<button class="btn-primary" onclick="saveReviewReply(\'' + reviewId + '\')">Save reply</button>'
        + '</div>';
      const editBtn = card.querySelector('button[onclick^="editReviewReply"]');
      if (editBtn) editBtn.remove();
      const removeBtn = card.querySelector('button[onclick^="removeReviewReply"]');
      if (removeBtn) removeBtn.remove();
    }

    async function removeReviewReply(reviewId) {
      if (!confirm('Remove your reply?')) return;
      const status = document.getElementById('reviewReplyStatus-' + reviewId);
      try {
        await authedFetch('/api/business/reviews/' + reviewId + '/reply', { method: 'DELETE' });
        renderAccountPanel();
      } catch (err) {
        if (status) status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    // ── Admin panel — a logged-in alternative to the emailed one-click
    // moderation links (see routes/admin.js), for when Ady can't find or
    // doesn't have that particular email to hand. adminBusinesses/
    // adminReviews are null for every account except the actual admin (the
    // server rejects the fetch with 403 — see renderAccountPanel), so this
    // whole card simply doesn't render for anyone else.
    function renderAdminCard(businesses, reviews) {
      if (businesses === null && reviews === null) return '';

      const businessRows = (businesses || []).length
        ? businesses.map((b) => {
            const date = new Date(b.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            return '<div class="review-row">'
              + '<div class="review-row-top"><span><strong>' + b.name + '</strong> — ' + b.category + (b.postcode ? ' · ' + b.postcode : '') + '</span><span class="review-row-date">' + date + '</span></div>'
              + '<p class="review-row-comment">' + b.email + ' · ' + (b.subscription_status || 'free') + '</p>'
              + '<button class="btn-secondary" onclick="adminRemoveBusiness(\'' + b.id + '\')">Remove listing</button>'
              + '<div id="adminBizStatus-' + b.id + '"></div>'
              + '</div>';
          }).join('')
        : '<p class="account-note">No listings.</p>';

      const reviewRows = (reviews || []).length
        ? reviews.map((r) => {
            const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
            const date = new Date(r.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            return '<div class="review-row">'
              + '<div class="review-row-top"><span><strong>' + r.businessName + '</strong> — <span class="review-row-stars">' + stars + '</span></span><span class="review-row-date">' + date + '</span></div>'
              + (r.comment ? '<p class="review-row-comment">' + r.comment + '</p>' : '')
              + (r.reply ? '<div class="review-row-reply"><strong>Business reply:</strong> ' + r.reply + '</div>' : '')
              + '<p class="review-row-comment">Reviewer: ' + r.reviewerEmail + '</p>'
              + '<button class="btn-secondary" onclick="adminRemoveReview(\'' + r.id + '\')">Remove review</button>'
              + '<div id="adminReviewStatus-' + r.id + '"></div>'
              + '</div>';
          }).join('')
        : '<p class="account-note">No reviews.</p>';

      return '<div class="card"><h2>🛠️ Admin</h2>'
        + '<p class="account-note">Everything the moderation emails let you do, but reachable while signed in — for when an email\'s gone missing.</p>'
        + '<h3 style="margin-bottom:6px;">All listings (' + (businesses || []).length + ')</h3>'
        + businessRows
        + '<h3 style="margin:16px 0 6px;">All reviews (' + (reviews || []).length + ')</h3>'
        + reviewRows
        + '</div>';
    }

    async function adminRemoveBusiness(id) {
      if (!confirm('Remove this listing from the directory? This can\'t be undone.')) return;
      const status = document.getElementById('adminBizStatus-' + id);
      try {
        await authedFetch('/api/admin/businesses/' + id, { method: 'DELETE' });
        renderAccountPanel();
      } catch (err) {
        if (status) status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function adminRemoveReview(id) {
      if (!confirm('Remove this review? This can\'t be undone.')) return;
      const status = document.getElementById('adminReviewStatus-' + id);
      try {
        await authedFetch('/api/admin/reviews/' + id, { method: 'DELETE' });
        renderAccountPanel();
      } catch (err) {
        if (status) status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function saveBusinessListing() {
      const name = document.getElementById('bizName').value.trim();
      const category = document.getElementById('bizCategory').value.trim();
      const postcode = document.getElementById('bizPostcode').value.trim();
      const description = document.getElementById('bizDescription').value.trim();
      const phone = document.getElementById('bizPhone').value.trim();
      const website = document.getElementById('bizWebsite').value.trim();
      const voucherTitle = document.getElementById('bizVoucherTitle').value.trim();
      const voucherDescription = document.getElementById('bizVoucherDescription').value.trim();
      const voucherExpiresAt = document.getElementById('bizVoucherExpiresAt').value.trim();
      const status = document.getElementById('businessStatusMsg');
      if (!name || !category || !postcode) {
        status.innerHTML = '<p class="account-error">Business name, category and postcode/town are required</p>';
        return;
      }
      if (!voucherTitle && (voucherDescription || voucherExpiresAt)) {
        status.innerHTML = '<p class="account-error">A voucher needs a short title</p>';
        return;
      }
      status.innerHTML = '<p class="account-note">Saving…</p>';
      try {
        await authedFetch('/api/business/listing', {
          method: 'PUT',
          body: JSON.stringify({ name, category, postcode, description, phone, website, voucherTitle, voucherDescription, voucherExpiresAt }),
        });
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function uploadBusinessLogo() {
      const fileInput = document.getElementById('bizLogoFile');
      const status = document.getElementById('bizLogoStatusMsg');
      const file = fileInput.files && fileInput.files[0];
      if (!file) { status.innerHTML = '<p class="account-error">Choose an image file first</p>'; return; }
      if (file.size > 2 * 1024 * 1024) { status.innerHTML = '<p class="account-error">Logo must be under 2MB</p>'; return; }

      status.innerHTML = '<p class="account-note">Uploading…</p>';
      try {
        const formData = new FormData();
        formData.append('logo', file);
        await authedUpload('/api/business/logo', formData);
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function removeBusinessListing() {
      try {
        await authedFetch('/api/business/listing', { method: 'DELETE' });
        renderAccountPanel();
      } catch (err) {
        showAccountError(err.message);
      }
    }

    async function startBusinessCheckout() {
      try {
        const { url } = await authedFetch('/api/business/create-checkout-session', { method: 'POST' });
        window.location.href = url;
      } catch (err) {
        showAccountError(err.message);
      }
    }

    async function openBusinessBillingPortal() {
      try {
        const { url } = await authedFetch('/api/business/create-portal-session', { method: 'POST' });
        window.location.href = url;
      } catch (err) {
        showAccountError(err.message);
      }
    }

    async function addLocation() {
      const label = document.getElementById('newLocationLabel').value.trim();
      const postcode = document.getElementById('newLocationPostcode').value.trim();
      const status = document.getElementById('locationStatusMsg');
      if (!label || !postcode) { status.innerHTML = '<p class="account-error">Enter both a label and a postcode/town</p>'; return; }
      status.innerHTML = '<p class="account-note">Saving…</p>';
      try {
        await authedFetch('/api/account/locations', { method: 'POST', body: JSON.stringify({ label, postcode }) });
        renderAccountPanel();
      } catch (err) {
        status.innerHTML = '<p class="account-error">' + err.message + '</p>';
      }
    }

    async function removeLocation(id) {
      try {
        await authedFetch('/api/account/locations/' + encodeURIComponent(id), { method: 'DELETE' });
        renderAccountPanel();
      } catch (err) {
        showAccountError(err.message);
      }
    }

    async function startCheckout() {
      try {
        const { url } = await authedFetch('/api/billing/create-checkout-session', { method: 'POST' });
        window.location.href = url;
      } catch (err) {
        showAccountError(err.message);
      }
    }

    async function openBillingPortal() {
      try {
        const { url } = await authedFetch('/api/billing/create-portal-session', { method: 'POST' });
        window.location.href = url;
      } catch (err) {
        showAccountError(err.message);
      }
    }

    document.getElementById('scanBtn').addEventListener('click', scanLocation);
    document.getElementById('myLocationBtn').addEventListener('click', useMyLocation);
    document.getElementById('locationInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') scanLocation();
    });
    if (currentLocation) document.getElementById('locationInput').value = currentLocation.label;
    updateLocationStatus();
    loadDashboard();
    initAccount();
  </script>
</body>
</html>
