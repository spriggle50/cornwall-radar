<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cornwall Radar — live weather, tides, traffic & things to do</title>
  <meta name="description" content="Live weather, tide times, traffic, buses, wildlife sightings, local news, days out and vouchers for Cornwall — all in one place, free to use." />
  <link rel="canonical" href="https://cornwallradar.co.uk/" />
  <!-- Social share preview (Facebook/WhatsApp/Nextdoor/X etc.) — this is
       what turns a bare link posted in a community group into something
       people actually stop and click, so it matters more than usual for a
       word-of-mouth launch. Using the square app icon as a placeholder
       og:image for now (no dedicated 1200x630 banner image exists yet) —
       swap in a proper wide banner later for a less-cropped preview. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cornwall Radar" />
  <meta property="og:title" content="Cornwall Radar — live weather, tides, traffic & things to do" />
  <meta property="og:description" content="Live weather, tide times, traffic, buses, wildlife sightings, local news, days out and vouchers for Cornwall — all in one place, free to use." />
  <meta property="og:url" content="https://cornwallradar.co.uk/" />
  <meta property="og:image" content="https://cornwallradar.co.uk/brand/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Cornwall Radar — live weather, tides, traffic & things to do" />
  <meta name="twitter:description" content="Live weather, tide times, traffic, buses, wildlife sightings, local news, days out and vouchers for Cornwall — all in one place, free to use." />
  <meta name="twitter:image" content="https://cornwallradar.co.uk/brand/icon-512.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
  <link rel="apple-touch-icon" href="/brand/icon-192.png" />
  <meta name="theme-color" content="#0d5b64" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Only used once SUPABASE_URL/SUPABASE_ANON_KEY are set on the server —
       see accountPanel's JS below. Harmless to load unconditionally. -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f5f4;
      --card-bg: #ffffff;
      --text: #12181a;
      --text-2: #5b6b6a;
      --text-3: #94a19f;
      --border: #e6ecea;
      --accent: #0a8f63;
      --accent-dark: #076b4a;
      --accent-soft: #e4f6ee;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --shadow-sm: 0 1px 2px rgba(16,30,25,0.05), 0 1px 4px rgba(16,30,25,0.06);
      --shadow-md: 0 8px 24px rgba(16,30,25,0.10);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(135deg, #12283f 0%, #0d5b64 48%, #076b4a 100%);
      color: #fff; padding: 22px 18px 26px;
    }
    header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    header h1 img { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
    header p { margin: 4px 0 0; opacity: 0.88; font-size: 0.88rem; font-weight: 500; }

    .location-wrap { max-width: 640px; margin: -16px auto 0; padding: 0 14px; position: relative; z-index: 2; }
    .location-bar {
      display: flex; gap: 6px; background: #fff; border-radius: var(--radius-md);
      padding: 6px; box-shadow: var(--shadow-md);
    }
    .location-bar input {
      flex: 1; padding: 10px 12px; border-radius: var(--radius-sm); border: none;
      font-size: 0.9rem; min-width: 0; font-family: inherit; color: var(--text); background: transparent;
    }
    .location-bar input:focus { outline: none; }
    .location-bar button {
      padding: 10px 16px; border-radius: var(--radius-sm); border: none; background: var(--accent);
      color: #fff; font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
      font-family: inherit; transition: background 0.13s;
    }
    .location-bar button:hover { background: var(--accent-dark); }
    .location-bar button:active { opacity: 0.85; }
    .location-bar #myLocationBtn { background: var(--accent-soft); color: var(--accent-dark); padding: 10px 13px; }
    .location-bar #myLocationBtn:hover { background: #d3f0e2; }
    .location-status {
      padding: 8px 4px 0; font-size: 0.78rem; color: var(--text-2); text-align: center;
    }
    .location-status .change-link {
      color: var(--accent-dark); text-decoration: underline; cursor: pointer; background: none;
      border: none; font: inherit; padding: 0; margin-left: 6px; font-weight: 600;
    }
    .location-error { color: #c0362c; }

    main { padding: 14px; max-width: 640px; margin: 0 auto; }
    .section-subtitle { font-size: 0.78rem; color: var(--text-2); margin: -4px 0 10px; }

    .card {
      background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px;
      margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .card h2 { margin: 0 0 10px; font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card h3 { margin: 0 0 6px; font-size: 0.88rem; font-weight: 700; color: var(--text-2); }
    .card .unavailable { color: var(--text-3); font-size: 0.9rem; }

    /* ── Weather hero — the one thing every visitor should see and register
       instantly, so it gets a full-bleed gradient treatment reflecting the
       actual conditions rather than a plain white card like everything else. */
    .weather-hero {
      border-radius: var(--radius-lg); padding: 24px 22px; margin-bottom: 16px;
      color: #fff; box-shadow: var(--shadow-md); position: relative; overflow: hidden;
    }
    .weather-hero.cond-clear   { background: linear-gradient(135deg, #2d9ee0 0%, #4fc3f7 60%, #81d4fa 100%); }
    .weather-hero.cond-night   { background: linear-gradient(135deg, #0f1c3f 0%, #26314f 60%, #3a4667 100%); }
    .weather-hero.cond-cloudy  { background: linear-gradient(135deg, #5c7080 0%, #839aab 100%); }
    .weather-hero.cond-rain    { background: linear-gradient(135deg, #33475b 0%, #4a6072 60%, #5d7285 100%); }
    .weather-hero.cond-snow    { background: linear-gradient(135deg, #5f8fc7 0%, #a9d6e5 100%); }
    .weather-hero.cond-fog     { background: linear-gradient(135deg, #7c8a94 0%, #b9c4cb 100%); }
    .weather-hero.cond-storm   { background: linear-gradient(135deg, #232526 0%, #3f3f46 100%); }

    .weather-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .weather-main { display: flex; align-items: center; gap: 14px; }
    .weather-emoji { font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15)); }
    .weather-temp { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .weather-condition { font-size: 0.95rem; font-weight: 600; opacity: 0.95; margin-top: 2px; }
    .weather-feelslike { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
    .weather-location-tag {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      background: rgba(255,255,255,0.18); padding: 5px 10px; border-radius: 999px; white-space: nowrap;
    }

    .weather-stats-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .weather-stat {
      flex: 1; min-width: 84px; background: rgba(255,255,255,0.16); border-radius: var(--radius-sm);
      padding: 9px 12px; backdrop-filter: blur(6px);
    }
    .weather-stat-label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }
    .weather-stat-value { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    .uv-low { color: #d7ffe6; } .uv-moderate { color: #fff5c2; } .uv-high { color: #ffd8a8; }
    .uv-veryhigh { color: #ffb4a8; } .uv-extreme { color: #ffb4f0; }

    .weather-forecast-strip {
      display: flex; gap: 8px; margin-top: 16px; padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.22);
    }
    .weather-forecast-day {
      flex: 1; text-align: center; background: rgba(255,255,255,0.1); border-radius: var(--radius-sm);
      padding: 9px 4px;
    }
    .weather-forecast-day-name { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; opacity: 0.85; }
    .weather-forecast-day-emoji { font-size: 1.35rem; margin: 4px 0 2px; }
    .weather-forecast-day-temps { font-size: 0.78rem; font-weight: 700; }
    .weather-forecast-day-temps .lo { opacity: 0.7; font-weight: 500; }

    /* ── Hub grid — small "calling cards" on the main page, each opening its
       own detail view instead of every list living on the main scroll. */
    .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .hub-card {
      background: var(--card-bg); border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
      box-shadow: var(--shadow-sm); text-align: left; border: none;
      padding: 0; display: flex; flex-direction: column; font-family: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .hub-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    /* aspect-ratio (not a fixed pixel height) so the photo keeps showing the
       same proportion of the shot as the card resizes — a fixed height was
       cropping down to a thin sliver (a bus's roof, a bird's wing) once the
       grid had more room to work with. */
    .hub-card-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
    .hub-card-body { padding: 11px 13px 13px; }
    .hub-card-title { font-size: 0.86rem; font-weight: 700; color: var(--text); margin-bottom: 3px; letter-spacing: -0.01em; }
    .hub-card-preview { font-size: 0.75rem; color: var(--text-2); line-height: 1.35; }
    /* Row-style hub card for sections with no photo (News) — spans the full
       grid width so the title has room to sit on one line, styled like a
       settings-list row rather than a squeezed-down photo card. */
    .hub-card.wide { grid-column: 1 / -1; }
    .hub-card.row { flex-direction: row; align-items: center; gap: 13px; padding: 15px 16px; }
    .hub-card.row .hub-card-icon {
      font-size: 1.5rem; flex-shrink: 0; width: 46px; height: 46px; border-radius: 13px;
      background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
    }
    .hub-card.row .hub-card-body { padding: 0; flex: 1; min-width: 0; }
    .hub-card.row .hub-card-title { margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hub-card.row .hub-card-preview { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hub-card.row .hub-card-chevron { flex-shrink: 0; color: var(--text-3); font-size: 1.1rem; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px;
      margin-bottom: 14px; font-size: 0.85rem; font-weight: 700; color: var(--text);
      cursor: pointer; font-family: inherit; box-shadow: var(--shadow-sm);
    }
    .back-btn:hover { background: var(--accent-soft); color: var(--accent-dark); }

    .news-item { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.9rem; }
    .news-item:first-child { border-top: none; padding-top: 2px; }
    .news-item a { color: var(--text); text-decoration: none; font-weight: 500; }
    .news-item a:hover { color: var(--accent-dark); }
    .sighting { font-size: 0.9rem; padding: 6px 0; }
    .sighting a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
    .sighting a:hover { text-decoration: underline; }
    .sighting-record-link { display: block; font-size: 0.76rem; margin-top: 2px; }
    .sighting.clickable { cursor: pointer; margin: 0 -18px; padding: 6px 18px; transition: background 0.13s; }
    .sighting.clickable:hover { background: var(--accent-soft); }
    #wildlifeMap { width: 100%; height: 300px; border-radius: var(--radius-sm); margin-bottom: 8px; background: #e5e7eb; }
    #stormOverflowMap { width: 100%; height: 300px; border-radius: var(--radius-sm); margin-bottom: 8px; background: #e5e7eb; }

    .train-row { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 10px; }
    .train-row:first-child { border-top: none; padding-top: 2px; }
    .train-row .train-time { font-weight: 700; min-width: 46px; }
    .train-row .train-dest { color: var(--text); }
    .train-row .train-meta { color: var(--text-3); font-size: 0.78rem; }
    .train-status { font-weight: 600; }
    .train-status.on-time { color: #15803d; }
    .train-status.delayed { color: #b45309; }
    .train-status.cancelled { color: #b91c1c; }
    .disruption-banner { background: #fef3c7; color: #92400e; padding: 9px 12px; border-radius: var(--radius-sm); font-size: 0.82rem; margin-bottom: 12px; }

    .overflow-item { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.9rem; }
    .overflow-item:first-child { border-top: none; padding-top: 2px; }
    .overflow-item.clickable { cursor: pointer; margin: 0 -18px; padding: 10px 18px; transition: background 0.13s; }
    .overflow-item.clickable:hover { background: var(--accent-soft); }
    .overflow-status-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; margin-right: 6px; }
    .overflow-status-badge.discharging { background: #fee2e2; color: #b91c1c; }
    .overflow-status-badge.not-discharging { background: #dcfce7; color: #15803d; }
    .overflow-status-badge.offline { background: #e5e7eb; color: #4b5563; }
    .overflow-watercourse { font-weight: 600; }
    .overflow-meta { color: var(--text-3); font-size: 0.78rem; margin-top: 2px; }

    .subhead { font-size: 0.95rem; margin: 16px 0 4px; color: var(--text-2); }
    .flood-warning { border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; font-size: 0.86rem; }
    .flood-warning.severe { background: #fee2e2; }
    .flood-warning.alert { background: #fef3c7; }
    .flood-warning.ended { background: var(--bg); color: var(--text-3); }
    .flood-warning-title { font-weight: 700; }
    .flood-warning-desc { margin-top: 2px; }
    .flood-warning-message { margin-top: 4px; font-size: 0.8rem; color: var(--text-2); }
    .level-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.88rem; }
    .level-row:first-child { border-top: none; padding-top: 2px; }
    .level-label { font-weight: 600; }
    .level-tidal-badge { font-size: 0.68rem; font-weight: 700; color: var(--accent-dark); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; }
    .level-value { text-align: right; font-weight: 700; }
    .level-meta { color: var(--text-3); font-size: 0.76rem; font-weight: 400; }

    .bw-search {
      width: 100%; box-sizing: border-box; padding: 10px 13px; margin: 4px 0 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem;
      font-family: inherit; background: #f9fbfa;
    }
    .bw-widget-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
    }
    .bw-widget-item { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: #f9fbfa; }
    .bw-widget-item iframe { display: block; }
    .traffic-item, .bus-item { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.9rem; }
    .traffic-item:first-child, .bus-item:first-child { border-top: none; padding-top: 2px; }
    .traffic-item .road, .bus-item .line { font-weight: 700; }
    .traffic-item .desc, .bus-item .dest { color: var(--text-2); }
    .bus-item .times { font-size: 0.8rem; color: var(--text-3); margin-top: 2px; }
    .bus-item a { color: var(--accent-dark); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
    .traffic-item.clickable { cursor: pointer; margin: 0 -18px; padding: 10px 18px; transition: background 0.13s; }
    .traffic-item.clickable:hover { background: var(--accent-soft); }
    .traffic-item-link { font-size: 0.76rem; font-weight: 700; color: var(--accent-dark); }
    .card-banner {
      /* Same reasoning as .hub-card-photo above: a fixed pixel height crops
         down to almost nothing once the centre column is allowed to stretch
         on a wider screen. aspect-ratio keeps a sensible proportion of the
         photo visible at any width, capped so it doesn't get absurdly tall
         on a narrow phone. */
      width: 100%; aspect-ratio: 20 / 7; max-height: 320px; object-fit: cover;
      border-radius: var(--radius-sm); margin-bottom: 14px; display: block;
    }
    #trafficMap { width: 100%; height: 340px; border-radius: var(--radius-sm); margin-bottom: 12px; background: #e5e7eb; }
    .map-legend { font-size: 0.72rem; color: var(--text-3); margin: -6px 0 14px; }

    .tide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .tide-chip {
      display: flex; align-items: center; gap: 10px; padding: 11px 13px;
      border-radius: var(--radius-sm); border: 1px solid var(--border); background: #f9fbfa;
    }
    .tide-chip.high { border-color: #a8e0cd; background: #edfaf4; }
    .tide-chip.low { border-color: #c7cffb; background: #f1f2fe; }
    .tide-chip-icon { font-size: 1.3rem; flex-shrink: 0; }
    .tide-chip-type { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-2); }
    .tide-chip-time { font-size: 1.15rem; font-weight: 800; color: var(--text); line-height: 1.15; }
    .tide-chip-height { font-size: 0.76rem; color: var(--accent-dark); font-weight: 700; }

    /* ── Weather Details page — extended forecast, pollen, and extra
       current-conditions stats. Kept as its own hub card + detail view
       rather than crowding the top-of-page hero, which stays the fast
       at-a-glance read. */
    .wd-subhead { font-size: 0.88rem; font-weight: 700; margin: 18px 0 10px; }
    .wd-subhead:first-of-type { margin-top: 4px; }

    .wd-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .wd-stat { padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #f9fbfa; }
    .wd-stat-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-2); }
    .wd-stat-value { font-size: 1rem; font-weight: 700; color: var(--text); margin-top: 2px; }

    .wd-forecast-list { display: flex; flex-direction: column; }
    .wd-forecast-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .wd-forecast-row:first-child { border-top: none; }
    .wd-forecast-day { font-weight: 700; width: 38px; flex-shrink: 0; }
    .wd-forecast-emoji { font-size: 1.2rem; flex-shrink: 0; }
    .wd-forecast-cond { flex: 1; color: var(--text-2); min-width: 0; }
    .wd-forecast-rain { color: var(--text-3); font-size: 0.78rem; flex-shrink: 0; }
    .wd-forecast-temps { font-weight: 700; flex-shrink: 0; }
    .wd-forecast-temps .lo { opacity: 0.6; font-weight: 500; }

    .pollen-list { display: flex; flex-direction: column; gap: 12px; }
    .pollen-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .pollen-type { font-size: 0.88rem; font-weight: 700; }
    .pollen-cat { font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .pollen-cat.pollen-low { background: var(--accent-soft); color: var(--accent-dark); }
    .pollen-cat.pollen-moderate { background: #fef3c7; color: #92400e; }
    .pollen-cat.pollen-high { background: #ffe4d5; color: #9a3412; }
    .pollen-cat.pollen-veryhigh { background: #fee2e2; color: #b91c1c; }
    .pollen-cat.pollen-none { background: #f1f2f4; color: var(--text-3); }
    .pollen-bar-track { height: 8px; border-radius: 999px; background: #eef1f0; overflow: hidden; }
    .pollen-bar-fill { height: 100%; border-radius: 999px; }
    .pollen-bar-fill.pollen-low { background: var(--accent); }
    .pollen-bar-fill.pollen-moderate { background: #f0b429; }
    .pollen-bar-fill.pollen-high { background: #f0713a; }
    .pollen-bar-fill.pollen-veryhigh { background: #dc2626; }
    .pollen-bar-fill.pollen-none { background: var(--text-3); }
    .pollen-tip { font-size: 0.78rem; color: var(--text-2); margin-top: 5px; line-height: 1.35; }

    .worldclock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .worldclock-item {
      padding: 10px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: #f9fbfa; text-align: center;
    }
    .worldclock-city {
      font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .worldclock-time { font-size: 1.05rem; font-weight: 800; color: var(--text); margin-top: 3px; }
    .worldclock-day {
      font-size: 0.62rem; font-weight: 700; color: var(--accent-dark); background: var(--accent-soft);
      padding: 1px 5px; border-radius: 999px;
    }

    /* ── Events & What's On — a free photo-card feed (What's On) plus an
       optional grid of ticketed events grouped by month. */
    .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .feed-card {
      background: #f9fbfa; border: 1px solid var(--border); border-radius: var(--radius-sm);
      overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: var(--text);
      transition: border-color 0.13s, transform 0.13s;
    }
    .feed-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .feed-card-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
    .feed-card-img-placeholder {
      width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; background: var(--accent-soft);
    }
    .feed-card-body { padding: 9px 10px; }
    .feed-card-title { font-size: 0.78rem; font-weight: 700; line-height: 1.35; margin-bottom: 3px; }
    .feed-card-date { font-size: 0.7rem; color: var(--text-3); }

    .event-month-group { margin-top: 18px; }
    .event-month-label {
      font-size: 0.78rem; font-weight: 800; color: var(--accent-dark); text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--border);
    }
    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .event-card {
      background: #f9fbfa; border: 1px solid var(--border); border-radius: var(--radius-sm);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .event-card-img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
    .event-card-body { padding: 11px 13px; display: flex; flex-direction: column; gap: 4px; }
    .event-card-meta-top { display: flex; }
    .event-cat-pill {
      font-size: 0.62rem; font-weight: 700; padding: 2px 9px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-dark); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .event-card-name { font-size: 0.86rem; font-weight: 700; line-height: 1.35; }
    .event-card-venue, .event-card-date { font-size: 0.75rem; color: var(--text-2); line-height: 1.4; }
    .event-tickets-btn {
      display: inline-block; margin-top: 6px; align-self: flex-start;
      padding: 5px 12px; border-radius: 999px; background: #FBBF24; color: #12181a;
      font-size: 0.72rem; font-weight: 700; text-decoration: none;
    }
    .event-tickets-btn:hover { background: #F59E0B; }

    /* ── Account panel — sign-in, saved locations, morning digest, billing.
       Reuses .card/.back-btn from the rest of the site rather than
       inventing a new visual language for one panel. */
    .account-btn {
      background: rgba(255,255,255,0.18); border: none; color: #fff; width: 38px; height: 38px;
      border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .account-btn:hover { background: rgba(255,255,255,0.28); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-top-text { min-width: 0; }

    .account-status-badge {
      display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 3px 10px; border-radius: 999px; margin-left: 8px;
    }
    .account-status-badge.free { background: var(--border); color: var(--text-2); }
    .account-status-badge.active { background: var(--accent-soft); color: var(--accent-dark); }
    .account-status-badge.past_due, .account-status-badge.canceled { background: #fde3e0; color: #b3261e; }

    .account-field { margin-bottom: 12px; }
    .account-field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-2); margin-bottom: 5px; }
    .account-field input, .account-field select {
      width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      font-size: 0.9rem; font-family: inherit; color: var(--text); background: #fff;
    }
    .account-field input:focus, .account-field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

    .btn-primary, .btn-secondary {
      padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-weight: 700;
      font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: background 0.13s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-primary:disabled { background: var(--border); color: var(--text-3); cursor: not-allowed; }
    .btn-secondary { background: var(--accent-soft); color: var(--accent-dark); }
    .btn-secondary:hover { background: #d3f0e2; }
    .btn-danger, .btn-primary.btn-danger { background: #fbe4e2; color: #a3271b; }
    .btn-danger:hover, .btn-primary.btn-danger:hover { background: #f6c9c5; }

    .location-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 0; border-top: 1px solid var(--border);
    }
    .location-row:first-child { border-top: none; }
    .location-row-label { font-weight: 700; font-size: 0.88rem; }
    .location-row-postcode { font-size: 0.76rem; color: var(--text-2); }
    .location-row-remove {
      background: none; border: none; color: var(--text-3); font-size: 0.85rem; cursor: pointer;
      font-family: inherit; padding: 4px 8px;
    }
    .location-row-remove:hover { color: #b3261e; }

    .account-note { font-size: 0.8rem; color: var(--text-2); line-height: 1.5; }
    .account-error { color: #b3261e; font-size: 0.85rem; margin: 6px 0; }
    .account-success { color: var(--accent-dark); font-size: 0.85rem; margin: 6px 0; }

    /* ── Business directory (Phase 3) ─────────────────────────────────── */
    .directory-search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .directory-search-bar input, .directory-search-bar select {
      flex: 1; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      font-size: 0.9rem; font-family: inherit; color: var(--text); background: #fff; min-width: 0;
    }
    .directory-row {
      padding: 12px 0; border-top: 1px solid var(--border);
    }
    .directory-row:first-child { border-top: none; }
    .directory-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .directory-row-logo {
      width: 44px; height: 44px; object-fit: contain; border-radius: var(--radius-sm); flex-shrink: 0;
      background: #fff; border: 1px solid var(--border); padding: 3px; box-sizing: border-box;
    }
    .directory-row-name { font-weight: 700; font-size: 0.95rem; }
    .directory-row-category { font-size: 0.76rem; color: var(--text-2); margin-top: 1px; }
    .directory-row-desc { font-size: 0.85rem; color: var(--text-2); margin: 6px 0 0; line-height: 1.45; }
    .directory-row-meta { font-size: 0.78rem; color: var(--text-3); margin-top: 6px; }
    .directory-row-meta a { color: var(--accent-dark); }
    .featured-badge {
      display: inline-block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; background: #fff2cc; color: #9a6b00;
      white-space: nowrap; flex-shrink: 0;
    }
    .review-toggle-link { text-decoration: none; font-weight: 600; }
    .review-toggle-link:hover { text-decoration: underline; }

    /* Reviews — both the expandable per-directory-row panel and the
       business owner's "reviews on your listing" card share these classes. */
    .reviews-panel { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .review-row { padding: 10px 0; border-top: 1px solid var(--border); }
    .review-row:first-child { border-top: none; }
    .review-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .review-row-stars { color: #9a6b00; font-size: 0.9rem; }
    .review-row-date { font-size: 0.75rem; color: var(--text-3); }
    .review-row-comment { font-size: 0.85rem; color: var(--text-2); margin: 4px 0 0; line-height: 1.45; }
    .review-row-reply {
      font-size: 0.82rem; color: var(--text-2); margin-top: 6px; padding: 8px 10px;
      background: var(--surface-2, #f4f6f5); border-radius: var(--radius-sm);
    }
    .review-form { margin-top: 8px; }
    .review-form label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
    .review-form select, .review-form textarea {
      width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      font-size: 0.88rem; font-family: inherit; color: var(--text); background: #fff; box-sizing: border-box;
      margin-bottom: 8px; resize: vertical;
    }

    /* Main-dashboard "Sponsored" strip — a handful of rotating Featured
       businesses, separate from (and higher-visibility than) the full
       directory page. Horizontally scrollable so it stays compact on
       mobile regardless of how many slots are configured server-side. */
    .sponsored-strip { margin-bottom: 14px; }
    .sponsored-strip-label {
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-3); margin: 0 2px 6px;
    }
    /* space-between so a handful of cards spread across the row's full
       width (e.g. 3 cards on a wide desktop row that could fit 5 sit at
       both ends with one in the middle) instead of bunching to the left
       with a slab of empty space on the right. Once there are enough
       sponsors to fill or overflow the row, this has no visible effect —
       it only kicks in when there's spare room to distribute. */
    .sponsored-row { display: flex; justify-content: space-between; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
    .sponsored-card {
      flex: 0 0 auto; width: 168px; background: var(--card-bg); border-radius: var(--radius-md);
      padding: 12px; box-shadow: var(--shadow-sm); text-align: left; text-decoration: none; color: inherit;
      border: 1px solid var(--border);
    }
    /* This is the actual "paying for visibility" real estate, so the logo
       here is deliberately much bigger than the 36px thumbnail used in the
       plain directory listing rows below — it should feel like the premium
       spot it is. */
    .sponsored-card-logo {
      width: 64px; height: 64px; object-fit: contain; border-radius: var(--radius-sm); margin-bottom: 8px;
      background: #fff; border: 1px solid var(--border); padding: 5px; box-sizing: border-box;
    }
    .sponsored-card-name { font-weight: 700; font-size: 0.85rem; line-height: 1.25; }
    .sponsored-card-category { font-size: 0.72rem; color: var(--text-2); margin-top: 2px; }

    footer { text-align: center; padding: 24px 16px; color: var(--text-3); font-size: 0.78rem; }
    footer .footer-legal { margin-top: 8px; }
    footer .footer-legal a { color: var(--text-2); text-decoration: none; margin: 0 6px; }
    footer .footer-legal a:hover { text-decoration: underline; }

    /* ── Wider screens: the whole layout was tuned mobile-first at 640px,
       which leaves a lot of dead space either side on a desktop browser.
       From ~860px up, let the centre column breathe — most noticeably the
       traffic map, which goes from a small strip to something you can
       actually read street names on. */
    @media (min-width: 860px) {
      .location-wrap, main { max-width: 960px; }
      .hub-grid { grid-template-columns: repeat(3, 1fr); }
      #trafficMap { height: 480px; }
      #wildlifeMap { height: 420px; }
      #stormOverflowMap { height: 420px; }
    }
    @media (min-width: 1200px) {
      .location-wrap, main { max-width: 1140px; }
      #trafficMap { height: 560px; }
      #wildlifeMap { height: 480px; }
      #stormOverflowMap { height: 480px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-top-text">
        <h1><img src="/brand/icon-96.png" alt="" /> Cornwall Radar</h1>
        <p>The place to check before heading out</p>
      </div>
      <button class="account-btn" id="accountBtn" title="Account">👤</button>
    </div>
  </header>
  <div class="location-wrap">
    <div class="location-bar" id="locationBar">
      <input type="text" id="locationInput" placeholder="Enter a Cornwall town or postcode…" />
      <button id="myLocationBtn" title="Use my current location">📍</button>
      <button id="scanBtn">Scan</button>
    </div>
    <div class="location-status" id="locationStatus">Showing: Cornwall-wide overview</div>
  </div>
  <main id="app">
    <div id="weatherSummary"><div class="card"><p>Loading live Cornwall data…</p></div></div>
    <div id="sponsoredStrip"></div>
    <div id="worldClockCard"></div>
    <div id="hubGrid" class="hub-grid"></div>
    <div id="detailPanel" hidden></div>
  </main>
  <main id="accountPanel" hidden></main>
  <footer>
    Weather: Open-Meteo · Wildlife: GBIF · Buses: BODS · Traffic: TomTom &amp; National Highways · Tides: tidetimes.org.uk
    <div class="footer-legal">
      <a href="/privacy-policy.html">Privacy Policy</a>·
      <a href="/terms.html">Terms of Use</a>·
      <a href="/cookie-policy.html">Cookie Policy</a>·
      <a href="mailto:info@cornwallradar.co.uk">Contact us</a>
    </div>
  </footer>

  <script>
    // ── Location search ──────────────────────────────────────────────────
    function loadSavedLocation() {
      try {
        const raw = localStorage.getItem('cornwallRadarLocation');
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    function saveLocation(loc) {
      try { localStorage.setItem('cornwallRadarLocation', JSON.stringify(loc)); } catch (e) {}
    }

    let currentLocation = loadSavedLocation(); // { lat, lon, label } or null = Cornwall-wide default
    let dashboardData = null; // last-fetched /api/dashboard payload
    let trafficMapInstance = null;
    let trafficMapLayers = []; // index-matched to the incidents list, so a list click can find its map layer
    let wildlifeMapInstance = null;
    let wildlifeMapMarkers = []; // index-matched to the sightings list, same pattern as the traffic map
    let stormOverflowMapInstance = null;
    let stormOverflowMapMarkers = []; // index-matched to the outfalls list

    function updateLocationStatus() {
      const el = document.getElementById('locationStatus');
      if (currentLocation) {
        el.innerHTML = 'Showing: ' + currentLocation.label
          + '<button class="change-link" onclick="clearLocation()">change</button>';
      } else {
        el.textContent = 'Showing: Cornwall-wide overview (traffic centred on Truro)';
      }
    }

    function clearLocation() {
      currentLocation = null;
      try { localStorage.removeItem('cornwallRadarLocation'); } catch (e) {}
      updateLocationStatus();
      loadDashboard();
    }

    async function scanLocation() {
      const input = document.getElementById('locationInput');
      const query = input.value.trim();
      if (!query) return;
      const status = document.getElementById('locationStatus');
      status.textContent = 'Searching for "' + query + '"…';
      try {
        const res = await fetch('/api/geocode?q=' + encodeURIComponent(query));
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Location not found');
        }
        const loc = await res.json();
        currentLocation = loc;
        saveLocation(loc);
        updateLocationStatus();
        loadDashboard();
      } catch (err) {
        status.innerHTML = '<span class="location-error">' + err.message + '</span>';
      }
    }

    // Lets a signed-in user jump the main dashboard straight to one of
    // their saved locations, the same way typing it into the search bar
    // would — without them having to retype the postcode/town every time.
    function viewSavedLocation(lat, lon, label) {
      currentLocation = { lat, lon, label };
      saveLocation(currentLocation);
      updateLocationStatus();
      loadDashboard();
      closeAccountPanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function useMyLocation() {
      if (!navigator.geolocation) return;
      const status = document.getElementById('locationStatus');
      status.textContent = 'Finding your location…';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: 'your current location' };
          saveLocation(currentLocation);
          updateLocationStatus();
          loadDashboard();
        },
        () => { status.innerHTML = '<span class="location-error">Could not get your location</span>'; }
      );
    }

    // ── Main load: fetch once, render the weather hero + the hub grid.
    // Full lists only get built when a hub card is opened. ────────────────
    async function loadDashboard() {
      try {
        const params = new URLSearchParams();
        if (currentLocation) {
          params.set('lat', currentLocation.lat);
          params.set('lon', currentLocation.lon);
        }
        const res = await fetch('/api/dashboard' + (params.toString() ? '?' + params.toString() : ''));
        dashboardData = await res.json();
        document.getElementById('weatherSummary').innerHTML = renderWeather(dashboardData.weather);
        document.getElementById('worldClockCard').innerHTML = renderWorldClockCard();
        startWorldClock();
        renderHubGrid();
        loadSponsoredStrip();
        startSponsoredRotation();
      } catch (err) {
        document.getElementById('weatherSummary').innerHTML =
          '<div class="card"><p class="unavailable">Could not reach the dashboard API: ' + err.message + '</p></div>';
      }
    }

    // Fetched separately from the main dashboard aggregation above — this
    // is Business Directory data (see routes/directory.js's /sponsored
    // endpoint), not one of the weather/traffic/etc. sources, and rotates
    // server-side on its own clock (see ROTATION_MS there). Re-fetched
    // below on a matching timer so a visitor who leaves the page open
    // actually sees the rotation happen, rather than only getting a
    // different set of sponsors on their next reload — a paying Featured
    // business shouldn't rely on visitors refreshing to ever see their
    // slot. Fails silently (empty strip) rather than showing an error
    // card — an empty "no sponsors yet" state isn't something a visitor
    // needs to be told about, unlike a real dashboard source going down.
    async function loadSponsoredStrip() {
      const el = document.getElementById('sponsoredStrip');
      try {
        const res = await fetch('/api/directory/sponsored?limit=3');
        const data = await res.json();
        const businesses = (data && data.businesses) || [];
        if (!businesses.length) { el.innerHTML = ''; return; }

        const cards = businesses.map((b) => {
          const logo = b.logo_url ? '<img src="' + b.logo_url + '" alt="" class="sponsored-card-logo" />' : '';
          const href = b.website || '#';
          return '<a class="sponsored-card" href="' + href + '"'
            + (b.website ? ' target="_blank" rel="noopener"' : ' onclick="openDetail(\'directory\'); return false;"')
            + '>' + logo
            + '<div class="sponsored-card-name">' + b.name + '</div>'
            + '<div class="sponsored-card-category">' + b.category + '</div>'
            + '</a>';
        }).join('');

        el.innerHTML = '<div class="sponsored-strip"><div class="sponsored-strip-label">Sponsored</div>'
          + '<div class="sponsored-row">' + cards + '</div></div>';
      } catch (err) {
        el.innerHTML = '';
      }
    }

    // Keeps the sponsored strip in sync with the server's own rotation
    // window (60s — matches ROTATION_MS in routes/directory.js) so it
    // visibly changes while someone is sitting on the page, not just
    // between page loads. Cleared/restarted rather than left to stack up
    // if loadDashboard ever runs again (e.g. switching saved locations).
    function startSponsoredRotation() {
      if (sponsoredStripInterval) clearInterval(sponsoredStripInterval);
      sponsoredStripInterval = setInterval(loadSponsoredStrip, 60 * 1000);
    }

    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function heroConditionClass(code, isDay) {
      if (!isDay && (code === 0 || code === 1 || code === 2)) return 'cond-night';
      if (code === 0) return 'cond-clear';
      if (code === 1 || code === 2) return 'cond-clear';
      if (code === 3) return 'cond-cloudy';
      if (code === 45 || code === 48) return 'cond-fog';
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return 'cond-rain';
      if ([71, 73, 75].includes(code)) return 'cond-snow';
      if ([95, 96, 99].includes(code)) return 'cond-storm';
      return 'cond-cloudy';
    }

    function uvLevel(uv) {
      if (uv == null) return null;
      if (uv < 3) return { label: 'Low', cls: 'uv-low' };
      if (uv < 6) return { label: 'Moderate', cls: 'uv-moderate' };
      if (uv < 8) return { label: 'High', cls: 'uv-high' };
      if (uv < 11) return { label: 'Very High', cls: 'uv-veryhigh' };
      return { label: 'Extreme', cls: 'uv-extreme' };
    }

    function renderWeather(w) {
      if (!w || w.unavailable) {
        return '<div class="card"><h2>🌦️ Weather</h2><p class="unavailable">Unavailable right now (' + (w?.error || 'unknown error') + ')</p></div>';
      }
      const c = w.current;
      const cls = heroConditionClass(c.code, c.isDay);
      const uv = uvLevel(c.uvIndexMax);
      const locTag = currentLocation ? currentLocation.label.split(',')[0] : 'Cornwall';

      const statsRow = '<div class="weather-stats-row">'
        + '<div class="weather-stat"><div class="weather-stat-label">Feels like</div><div class="weather-stat-value">' + Math.round(c.feelsLikeC) + '&deg;</div></div>'
        + '<div class="weather-stat"><div class="weather-stat-label">Wind</div><div class="weather-stat-value">' + Math.round(c.windKph) + ' km/h</div></div>'
        + (uv ? '<div class="weather-stat"><div class="weather-stat-label">UV Today</div><div class="weather-stat-value ' + uv.cls + '">' + uv.label + '</div></div>' : '')
        + '</div>';

      const forecast = (w.forecast || []).slice(1, 5).map(f => {
        const d = new Date(f.date + 'T12:00:00');
        const dayName = isNaN(d) ? '' : DAY_NAMES[d.getDay()];
        return '<div class="weather-forecast-day">'
          + '<div class="weather-forecast-day-name">' + dayName + '</div>'
          + '<div class="weather-forecast-day-emoji">' + f.emoji + '</div>'
          + '<div class="weather-forecast-day-temps">' + Math.round(f.maxTempC) + '&deg; <span class="lo">' + Math.round(f.minTempC) + '&deg;</span></div>'
          + '</div>';
      }).join('');

      return '<div class="weather-hero ' + cls + '">'
        + '<div class="weather-hero-top">'
        + '<div class="weather-main">'
        + '<span class="weather-emoji">' + c.emoji + '</span>'
        + '<div><div class="weather-temp">' + Math.round(c.tempC) + '&deg;</div>'
        + '<div class="weather-condition">' + c.condition + '</div>'
        + '<div class="weather-feelslike">Feels like ' + Math.round(c.feelsLikeC) + '&deg;</div></div>'
        + '</div>'
        + '<span class="weather-location-tag">📍 ' + locTag + '</span>'
        + '</div>'
        + statsRow
        + (forecast ? '<div class="weather-forecast-strip">' + forecast + '</div>' : '')
        + '</div>';
    }

    // ── Hub cards: one short "calling card" per section, each opening a
    // full detail view on tap instead of growing the main page forever. ──
    function hubPreview(key) {
      const d = dashboardData || {};
      if (key === 'traffic') {
        const t = d.traffic;
        if (!t || t.unavailable) return 'Unavailable right now';
        if (t.configured === false) return 'Not set up yet';
        return (t.incidents && t.incidents.length) ? t.incidents.length + ' incident(s) reported' : 'Roads look clear';
      }
      if (key === 'buses') {
        const b = d.buses;
        if (!b || b.unavailable) return 'Unavailable right now';
        if (b.configured === false) return 'Not set up yet';
        return (b.vehicles && b.vehicles.length) ? b.vehicles.length + ' active route(s)' : 'No active routes right now';
      }
      if (key === 'tides') {
        const t = d.tides;
        if (!t || t.unavailable) return 'Unavailable right now';
        if (!t.tides || !t.tides.length) return 'No tide data right now';
        const next = t.tides[0];
        return 'Next: ' + next.type + ' tide at ' + next.time;
      }
      if (key === 'wildlife') {
        const wl = d.wildlife;
        if (!wl || wl.unavailable || !wl.sightings || !wl.sightings.length) return 'No recent sightings';
        return wl.sightings.length + ' recent sighting(s)';
      }
      if (key === 'news') {
        const n = d.news;
        if (!n || !n.items || !n.items.length) return 'No stories right now';
        return n.items[0].title;
      }
      if (key === 'eventsWhatson') {
        const w = d.whatson;
        if (w && w.items && w.items.length) return w.items[0].title;
        const e = d.events;
        if (e && e.configured && e.events && e.events.length) return e.events.length + ' upcoming event(s)';
        return "What's on around Cornwall";
      }
      if (key === 'weatherDetails') {
        const p = d.pollen;
        if (p && p.configured && p.types && p.types.length) {
          const top = p.types.slice().sort((a, b) => (b.value || 0) - (a.value || 0))[0];
          return 'Pollen: ' + (top.category || 'available') + ' · extended forecast';
        }
        return 'Pollen count & extended forecast';
      }
      if (key === 'sport') {
        const s = d.sport;
        if (!s || !s.items || !s.items.length) return 'No sport stories right now';
        return s.items[0].title;
      }
      if (key === 'councilNews') {
        const c = d.councilNews;
        if (!c || !c.items || !c.items.length) return 'No council news right now';
        return c.items[0].title;
      }
      if (key === 'trains') {
        const t = d.trains;
        if (!t || t.unavailable) return 'Unavailable right now';
        if (!t.services || !t.services.length) return t.station ? 'No departures listed for ' + t.station.name : 'No departures right now';
        const next = t.services[0];
        return t.station.name + ': ' + next.scheduledTime + ' to ' + (next.destination || '?');
      }
      if (key === 'stormOverflows') {
        const so = d.stormOverflows;
        if (!so || so.unavailable) return 'Unavailable right now';
        if (!so.dischargingCount) return 'No active discharges reported';
        return so.dischargingCount + ' outfall(s) currently discharging';
      }
      if (key === 'floodMonitoring') {
        const fm = d.floodMonitoring;
        if (!fm || fm.unavailable) return 'Unavailable right now';
        const active = (fm.warnings || []).filter(w => w.severityLevel !== 4);
        if (active.length) return active.length + ' flood warning/alert(s) in Cornwall';
        return 'No flood warnings — river & sea levels inside';
      }
      if (key === 'bathingWater') {
        const bw = d.bathingWater;
        if (!bw || bw.unavailable || !bw.sites || !bw.sites.length) return 'Unavailable right now';
        return bw.sites.length + ' Cornwall beaches — live EA ratings';
      }
      // Directory isn't part of dashboardData (it's its own public endpoint,
      // fetched fresh with search/filter params whenever the page opens —
      // see renderDirectoryDetail), so this preview is just static copy
      // rather than a live count.
      if (key === 'directory') return 'Find local businesses, or list your own';
      // Activities/vouchers aren't part of dashboardData either, same reason
      // as the directory above — their own public endpoint, own filters.
      if (key === 'activities') return 'Search things to do across Cornwall';
      if (key === 'vouchers') return 'Local discounts and offers — free to browse';
      return '';
    }

    const HUB_SECTIONS = [
      { key: 'directory', icon: '🏪', title: 'Business Directory' },
      { key: 'activities', icon: '🎡', title: 'Days Out & Activities', photo: '/images/activities-hero.jpg' },
      { key: 'vouchers', icon: '🎟️', title: 'Vouchers & Offers', photo: '/images/vouchers-hero.jpg' },
      { key: 'weatherDetails', icon: '🌤️', title: 'Weather Details', photo: '/images/weather-hero.jpg' },
      { key: 'traffic', icon: '🚗', title: 'Traffic', photo: '/images/traffic-hero.jpg' },
      { key: 'buses', icon: '🚌', title: 'Live Buses', photo: '/images/buses-hero.jpg' },
      { key: 'tides', icon: '🌊', title: 'Tide Times', photo: '/images/tides.jpg' },
      { key: 'wildlife', icon: '🦡', title: 'Wildlife', photo: '/images/wildlife-hero.jpg' },
      { key: 'eventsWhatson', icon: '🎉', title: "Events & What's On", photo: '/images/events.jpg' },
      { key: 'news', icon: '📰', title: 'Cornwall News', photo: '/images/community.jpg' },
      // No stock photo asset for sport — instead of picking an arbitrary
      // static image, borrow whatever thumbnail the top story itself
      // carries (the feed provides one for most stories), same trick the
      // reference implementation uses for its own photo-forward hub cards.
      { key: 'sport', icon: '⚽', title: 'Cornwall Sport', dynamicPhoto: (d) => d.sport?.items?.[0]?.image || null },
      { key: 'councilNews', icon: '🏛️', title: 'Cornwall Council News', photo: '/images/council-news.jpg' },
      { key: 'trains', icon: '🚆', title: 'Train Times', photo: '/images/trains.jpg' },
      { key: 'stormOverflows', icon: '💧', title: 'Storm Overflows', photo: '/images/storm-overflow.jpg' },
      { key: 'floodMonitoring', icon: '🌧️', title: 'River & Sea Levels', photo: '/images/river-levels.jpg' },
      { key: 'bathingWater', icon: '🏖️', title: 'Bathing Water Quality', photo: '/images/bathing-water.jpg' },
    ];

    function renderHubGrid() {
      const grid = document.getElementById('hubGrid');
      grid.innerHTML = HUB_SECTIONS.map(s => {
        const preview = hubPreview(s.key);
        const photo = s.photo || (s.dynamicPhoto && dashboardData ? s.dynamicPhoto(dashboardData) : null);
        if (photo) {
          return '<button class="hub-card" onclick="openDetail(\'' + s.key + '\')">'
            + '<img class="hub-card-photo" src="' + photo + '" alt="" />'
            + '<div class="hub-card-body"><div class="hub-card-title">' + s.icon + ' ' + s.title + '</div>'
            + '<div class="hub-card-preview">' + preview + '</div></div>'
            + '</button>';
        }
        return '<button class="hub-card row wide" onclick="openDetail(\'' + s.key + '\')">'
          + '<span class="hub-card-icon">' + s.icon + '</span>'
          + '<div class="hub-card-body"><div class="hub-card-title">' + s.title + '</div>'
          + '<div class="hub-card-preview">' + preview + '</div></div>'
          + '<span class="hub-card-chevron">›</span>'
          + '</button>';
      }).join('');
    }

    function openDetail(key) {
      document.getElementById('hubGrid').hidden = true;
      const panel = document.getElementById('detailPanel');
      panel.hidden = false;

      // The directory isn't part of the once-per-load dashboardData payload
      // (it's public data with its own search/filter params, refetched on
      // demand), so it gets its own async render path instead of the
      // synchronous renderers map below.
      if (key === 'directory') { renderDirectoryDetail(); return; }
      if (key === 'activities') { renderActivitiesDetail(); return; }
      if (key === 'vouchers') { renderVouchersDetail(); return; }

      const renderers = {
        traffic: renderTrafficDetail,
        buses: renderBusesDetail,
        tides: renderTidesDetail,
        wildlife: renderWildlifeDetail,
        news: renderNewsDetail,
        weatherDetails: renderWeatherDetailsDetail,
        eventsWhatson: renderEventsWhatsonDetail,
        sport: renderSportDetail,
        councilNews: renderCouncilNewsDetail,
        trains: renderTrainsDetail,
        stormOverflows: renderStormOverflowsDetail,
        floodMonitoring: renderFloodMonitoringDetail,
        bathingWater: renderBathingWaterDetail,
      };
      const backBtn = '<button class="back-btn" onclick="closeDetail()">← Back</button>';
      // weatherDetails and eventsWhatson each draw from more than one
      // top-level field at once, so they get the whole payload instead of
      // a single dashboardData[key] slice.
      const multiFieldKeys = ['weatherDetails', 'eventsWhatson'];
      const sectionData = multiFieldKeys.includes(key) ? dashboardData : (dashboardData ? dashboardData[key] : null);
      panel.innerHTML = backBtn + renderers[key](sectionData);

      if (key === 'traffic') initTrafficMap(dashboardData ? dashboardData.traffic : null);
      if (key === 'wildlife') initWildlifeMap(dashboardData ? dashboardData.wildlife : null);
      if (key === 'stormOverflows') initStormOverflowMap(dashboardData ? dashboardData.stormOverflows : null);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeDetail() {
      if (trafficMapInstance) { trafficMapInstance.remove(); trafficMapInstance = null; }
      if (wildlifeMapInstance) { wildlifeMapInstance.remove(); wildlifeMapInstance = null; }
      if (stormOverflowMapInstance) { stormOverflowMapInstance.remove(); stormOverflowMapInstance = null; }
      document.getElementById('detailPanel').hidden = true;
      document.getElementById('detailPanel').innerHTML = '';
      document.getElementById('hubGrid').hidden = false;
    }

    // Shared not-configured / error / coming-online states for a section
    // that hasn't got a live list to show. Returns null when the section
    // is configured and should be rendered by its own list renderer instead.
    function unavailableState(title, section) {
      if (section && section.configured === false) {
        return '<div class="card"><h2>' + title + '</h2><p class="unavailable">' + section.message + '</p></div>';
      }
      if (section && section.unavailable) {
        return '<div class="card"><h2>' + title + '</h2><p class="unavailable">Error: ' + section.error + '</p></div>';
      }
      if (!section || section.configured !== true) {
        return '<div class="card"><h2>' + title + '</h2><p class="unavailable">Coming online once configured</p></div>';
      }
      return null;
    }

    function renderTrafficDetail(t) {
      const title = '🚗 Traffic';
      const state = unavailableState(title, t);
      if (state) return state;

      const subtitle = t.searchedLocation ? '<p class="section-subtitle">' + t.searchedLocation + '</p>' : '';
      const notes = (t.sourceNotes && t.sourceNotes.length)
        ? '<p class="section-subtitle" style="color:#b45309;">' + t.sourceNotes.join(' · ') + '</p>'
        : '';
      const mapBlock = '<div id="trafficMap"></div><p class="map-legend">🟠 closure (National Highways) · 🔴 incident (TomTom) · coloured lines show live traffic flow speed</p>';

      if (!t.incidents || t.incidents.length === 0) {
        return '<div class="card"><h2>' + title + '</h2>' + subtitle + notes + mapBlock + '<p class="unavailable">No incidents reported right now — roads look clear</p></div>';
      }
      // Indices here line up 1:1 with the (unsliced) array initTrafficMap
      // builds its markers/lines from below, so a click can jump straight
      // to that incident's own layer on the map above.
      const items = t.incidents.slice(0, 20).map((i, idx) => {
        const badge = i.kind === 'closure' ? '🟠 Closure' : '🔴 Incident';
        const cls = 'traffic-item' + (i.coordinates ? ' clickable' : '');
        const onclick = i.coordinates ? ' onclick="focusTrafficIncident(' + idx + ')"' : '';
        const mapLink = i.coordinates ? ' <span class="traffic-item-link">📍 Show on map</span>' : '';
        return '<div class="' + cls + '"' + onclick + '><span class="road">' + badge + ' · ' + i.road + mapLink + '</span><br>'
          + '<span class="desc">' + i.description + '</span></div>';
      }).join('');
      return '<div class="card"><h2>' + title + '</h2>' + subtitle + notes + mapBlock + items + '</div>';
    }

    // Sets up (or resets) the Leaflet map for the traffic detail view. Base
    // tiles are plain OpenStreetMap (free, no key, always works); the
    // TomTom flow-speed overlay is added only if a key is configured —
    // its absence should never break the map itself. Incident markers/
    // lines come from data we already fetched via TomTom's incidentDetails
    // API, so they render even if the flow-tile overlay has any hiccup.
    async function initTrafficMap(t) {
      const mapEl = document.getElementById('trafficMap');
      if (!mapEl) return;
      if (typeof L === 'undefined') {
        mapEl.outerHTML = '<p class="unavailable">Map could not load (Leaflet failed to load from its CDN) — the incident list below is still live.</p>';
        return;
      }
      if (trafficMapInstance) { trafficMapInstance.remove(); trafficMapInstance = null; }

      const center = (t && t.center && t.center.lat != null) ? t.center : { lat: 50.2632, lon: -5.0510 };
      const map = L.map('trafficMap').setView([center.lat, center.lon], 11);
      trafficMapInstance = map;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);

      try {
        const res = await fetch('/api/tomtom-key');
        const { key } = await res.json();
        if (key) {
          // No "t" (model id) param — passing an arbitrary value here
          // breaks every tile request with a 400; it's optional and
          // TomTom uses its current model when omitted.
          L.tileLayer('https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=' + key, {
            opacity: 0.7,
            maxZoom: 19,
          }).addTo(map);
        }
      } catch (e) { /* flow overlay is a bonus layer — map still works without it */ }

      // Indexed to match renderTrafficDetail's list exactly (same source
      // array, same order) so a click on a list row can look its marker/
      // line straight up here and jump the map to it.
      trafficMapLayers = [];
      (t && t.incidents ? t.incidents : []).forEach((inc, idx) => {
        if (!inc.coordinates) return;
        const color = inc.kind === 'closure' ? '#ea580c' : '#dc2626'; // orange for National Highways closures, red for TomTom incidents
        const label = (inc.kind === 'closure' ? 'Closure: ' : 'Incident: ') + inc.description;
        if (inc.geometryType === 'LineString') {
          const latlngs = inc.coordinates.map((c) => [c[1], c[0]]);
          trafficMapLayers[idx] = L.polyline(latlngs, { color, weight: 4 }).addTo(map).bindPopup(label);
        } else {
          const [lon, lat] = inc.coordinates;
          trafficMapLayers[idx] = L.circleMarker([lat, lon], { radius: 8, color, fillColor: color, fillOpacity: 0.8 }).addTo(map).bindPopup(label);
        }
      });
    }

    // Called when a traffic list row is clicked — pans/zooms the map to
    // that incident's own marker or line and pops its label open, instead
    // of leaving the map and the list feeling like two disconnected things.
    function focusTrafficIncident(idx) {
      if (!trafficMapInstance) return;
      const layer = trafficMapLayers[idx];
      if (!layer) return;
      if (layer.getLatLng) {
        trafficMapInstance.setView(layer.getLatLng(), 14, { animate: true });
      } else if (layer.getBounds) {
        trafficMapInstance.fitBounds(layer.getBounds(), { maxZoom: 15 });
      }
      layer.openPopup();
      document.getElementById('trafficMap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // All sightings come from GBIF already filtered to Cornwall's bounding
    // box, so a plain OpenStreetMap tile layer with one marker per sighting
    // is enough to show where in Cornwall each was actually spotted —
    // same Leaflet setup as the traffic map above, just simpler (no lines,
    // no live overlay, just points).
    function initWildlifeMap(wl) {
      const mapEl = document.getElementById('wildlifeMap');
      if (!mapEl) return;
      if (typeof L === 'undefined') {
        mapEl.outerHTML = '<p class="unavailable">Map could not load (Leaflet failed to load from its CDN) — the sightings list below is still live.</p>';
        return;
      }
      if (wildlifeMapInstance) { wildlifeMapInstance.remove(); wildlifeMapInstance = null; }

      const sightings = (wl && wl.sightings ? wl.sightings : []).slice(0, 15);
      const located = sightings.filter(s => s.lat != null && s.lon != null);
      const center = located.length
        ? { lat: located[0].lat, lon: located[0].lon }
        : { lat: 50.2632, lon: -5.0510 }; // Cornwall-wide fallback when nothing has coordinates

      const map = L.map('wildlifeMap').setView([center.lat, center.lon], located.length ? 10 : 9);
      wildlifeMapInstance = map;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);

      // Indexed to match renderWildlifeDetail's own sightings.slice(0, 15)
      // exactly, so clicking a list row can jump straight to its own marker.
      wildlifeMapMarkers = [];
      sightings.forEach((s, idx) => {
        if (s.lat == null || s.lon == null) return;
        const label = '<strong>' + s.species + '</strong>' + (s.date ? '<br>' + s.date : '') + (s.locality ? '<br>' + s.locality : '');
        const marker = L.circleMarker([s.lat, s.lon], {
          radius: 7, color: '#15803d', fillColor: '#22c55e', fillOpacity: 0.85,
        }).addTo(map).bindPopup(label);
        // Hover shows which bird (etc.) was spotted there without needing a
        // click first; a real click (from the marker itself, or from
        // focusWildlifeSighting below) still opens/keeps the popup so it
        // doesn't vanish the moment the mouse moves off.
        marker.on('mouseover', () => marker.openPopup());
        marker.on('mouseout', () => marker.closePopup());
        wildlifeMapMarkers[idx] = marker;
      });

      if (located.length > 1) {
        const bounds = L.latLngBounds(located.map(s => [s.lat, s.lon]));
        map.fitBounds(bounds, { padding: [24, 24], maxZoom: 13 });
      }
    }

    // Called when a sighting row is clicked — same pan/zoom/popup pattern
    // as focusTrafficIncident above, so the map and list feel connected.
    function focusWildlifeSighting(idx) {
      if (!wildlifeMapInstance) return;
      const marker = wildlifeMapMarkers[idx];
      if (!marker) return;
      wildlifeMapInstance.setView(marker.getLatLng(), 13, { animate: true });
      marker.openPopup();
      document.getElementById('wildlifeMap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function renderBusesDetail(b) {
      const title = '🚌 Live Buses';
      const state = unavailableState(title, b);
      if (state) return state;

      const subtitle = b.searchedLocation ? '<p class="section-subtitle">' + b.searchedLocation + '</p>' : '';

      if (!b.vehicles || b.vehicles.length === 0) {
        return '<div class="card"><h2>' + title + '</h2>' + subtitle + '<p class="unavailable">No active routes reported right now</p></div>';
      }
      const items = b.vehicles.slice(0, 15).map(v => {
        const times = [
          v.nearLocation ? 'near ' + v.nearLocation : '',
          v.updatedTime ? 'updated ' + v.updatedTime : '',
          v.arrivalTime ? 'due ' + v.arrivalTime : '',
        ].filter(Boolean).join(' · ');
        return '<div class="bus-item">'
          + '<span class="line">' + v.line + '</span> '
          + '<span class="dest">to ' + v.destination + '</span>'
          + (times ? '<div class="times">' + times + '</div>' : '')
          + (v.mapUrl ? '<a href="' + v.mapUrl + '" target="_blank">View on map</a>' : '')
          + '</div>';
      }).join('');
      return '<div class="card"><h2>' + title + '</h2>' + subtitle + items + '</div>';
    }

    function renderTidesDetail(t) {
      const title = '🌊 Tide Times';
      const banner = '<img class="card-banner" src="/images/tides.jpg" alt="" />';

      if (!t || t.unavailable) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">Unavailable right now (' + (t?.error || 'unknown error') + ')</p></div>';
      }
      if (!t.tides || t.tides.length === 0) {
        return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">No tide data right now</p></div>';
      }
      const subtitle = t.station ? '<p class="section-subtitle">Nearest station: ' + t.station + '</p>' : '';
      const chips = t.tides.slice(0, 8).map(tide => {
        const cls = tide.type === 'High' ? 'high' : 'low';
        const icon = tide.type === 'High' ? '⬆️' : '⬇️';
        return '<div class="tide-chip ' + cls + '">'
          + '<span class="tide-chip-icon">' + icon + '</span>'
          + '<div><div class="tide-chip-type">' + tide.type + ' Tide</div>'
          + '<div class="tide-chip-time">' + tide.time + '</div>'
          + '<div class="tide-chip-height">' + tide.heightM + 'm</div></div>'
          + '</div>';
      }).join('');
      return '<div class="card">' + banner + '<h2>' + title + '</h2>' + subtitle + '<div class="tide-grid">' + chips + '</div></div>';
    }

    function renderWildlifeDetail(wl) {
      // The bird in this photo has its head in the upper third of the
      // frame, and the default centred object-fit crop was cutting straight
      // through it on the wide banner aspect ratio — bias the crop upward
      // so the whole head stays in frame.
      const banner = '<img class="card-banner" src="/images/wildlife-hero.jpg" alt="" style="object-position: 50% 22%;" />';
      if (!wl || wl.unavailable || !wl.sightings || wl.sightings.length === 0) {
        return '<div class="card">' + banner + '<h2>🦡 Wildlife Sightings</h2><p class="unavailable">No recent sightings available right now</p></div>';
      }
      // Every sighting GBIF gives us is already inside Cornwall's bounding
      // box (see wildlife.js), so plotting them together shows at a glance
      // where in Cornwall things are actually being spotted, not just a list
      // of names with nothing to place them on the map.
      const sightings = wl.sightings.slice(0, 15);
      const anyLocated = sightings.some(s => s.lat != null && s.lon != null);
      const mapBlock = anyLocated
        ? '<div id="wildlifeMap"></div><p class="map-legend">🟢 sighting location — click a sighting below to jump to it</p>'
        : '';
      // Indices here line up 1:1 with the same sightings array initWildlifeMap
      // builds its markers from, so a click can jump straight to that
      // sighting's own marker on the map above (same pattern as the traffic
      // list/map link).
      const items = sightings.map((s, idx) => {
        // Species name links to GBIF's species page (background, photos,
        // taxonomy) when GBIF gave us one; the location links to a map of
        // exactly where this sighting was logged. Neither existed before —
        // a sighting with no coordinates and no species key just stays as
        // plain text rather than link to nowhere.
        const speciesLabel = s.gbifSpeciesKey
          ? '<a href="https://www.gbif.org/species/' + s.gbifSpeciesKey + '" target="_blank">' + s.species + '</a>'
          : s.species;
        const hasCoords = s.lat != null && s.lon != null;
        const mapLink = hasCoords
          ? ' — <a href="https://www.google.com/maps?q=' + s.lat + ',' + s.lon + '" target="_blank">' + (s.locality || 'View location') + '</a>'
          : (s.locality ? ' — ' + s.locality : '');
        const recordLink = s.gbifOccurrenceId
          ? ' <a class="sighting-record-link" href="https://www.gbif.org/occurrence/' + s.gbifOccurrenceId + '" target="_blank">Sighting record ↗</a>'
          : '';
        const cls = 'sighting' + (hasCoords ? ' clickable' : '');
        const onclick = hasCoords ? ' onclick="focusWildlifeSighting(' + idx + ')"' : '';
        const pinLink = hasCoords ? ' <span class="traffic-item-link">📍 Show on map</span>' : '';
        return '<div class="' + cls + '"' + onclick + '>' + speciesLabel + mapLink + pinLink + recordLink + '</div>';
      }).join('');
      return '<div class="card">' + banner + '<h2>🦡 Wildlife Sightings</h2>' + mapBlock + items + '</div>';
    }

    // Weather Details — a second, separate page from the top-of-page hero.
    // The hero stays the fast at-a-glance read (Open-Meteo, always on); this
    // page is for someone who wants to dig further: the full multi-day
    // forecast, plus pollen counts and extra current-conditions stats from
    // the Google APIs, both of which only appear once GOOGLE_MAPS_API_KEY is set.
    function pollenCategoryClass(category) {
      if (!category) return 'pollen-none';
      const c = category.toLowerCase();
      if (c.includes('very high')) return 'pollen-veryhigh';
      if (c.includes('high')) return 'pollen-high';
      if (c.includes('moderate')) return 'pollen-moderate';
      if (c.includes('low')) return 'pollen-low';
      return 'pollen-none';
    }

    // World Clock — a small strip on the Weather Details page for checking
    // the time in a handful of other places (handy when Cornwall gets
    // visitors, or has family/friends, elsewhere in the world). This runs
    // entirely on the browser's own built-in timezone database (Intl), so
    // unlike the rest of this page it needs no API key, no network call, and
    // can't go down or run out of quota — a fixed list of cities doesn't
    // need a per-request geocoded lookup, so the Google Time Zone API isn't
    // actually needed here (it stays useful only if this ever needs the
    // timezone for an arbitrary searched location rather than a fixed list).
    const WORLD_CLOCK_CITIES = [
      { label: 'Cornwall', tz: 'Europe/London' },
      { label: 'New York', tz: 'America/New_York' },
      { label: 'Los Angeles', tz: 'America/Los_Angeles' },
      { label: 'Dubai', tz: 'Asia/Dubai' },
      { label: 'Sydney', tz: 'Australia/Sydney' },
      { label: 'Tokyo', tz: 'Asia/Tokyo' },
    ];
    let worldClockInterval = null;
    let sponsoredStripInterval = null;

    function worldClockItemsHtml() {
      const now = new Date();
      const localDay = new Intl.DateTimeFormat('en-GB', { weekday: 'short', timeZone: 'Europe/London' }).format(now);
      return WORLD_CLOCK_CITIES.map(c => {
        const time = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: c.tz }).format(now);
        const day = new Intl.DateTimeFormat('en-GB', { weekday: 'short', timeZone: c.tz }).format(now);
        const dayTag = day !== localDay ? '<span class="worldclock-day">' + day + '</span>' : '';
        return '<div class="worldclock-item">'
          + '<div class="worldclock-city">' + c.label + '</div>'
          + '<div class="worldclock-time">' + time + ' ' + dayTag + '</div>'
          + '</div>';
      }).join('');
    }

    // Lives on the main page itself, right under the weather hero, rather
    // than tucked inside the Weather Details page — it's meant to be seen
    // at a glance, not found by clicking in. It's rebuilt fresh on every
    // loadDashboard() call and then just ticks over locally every 30s
    // (only the numbers need to refresh — no server round-trip involved).
    function renderWorldClockCard() {
      return '<div class="card"><h2>🕐 World Clock</h2><div class="worldclock-grid" id="worldClockGrid">' + worldClockItemsHtml() + '</div></div>';
    }

    function startWorldClock() {
      if (worldClockInterval) clearInterval(worldClockInterval);
      worldClockInterval = setInterval(() => {
        const grid = document.getElementById('worldClockGrid');
        if (!grid) return;
        grid.innerHTML = worldClockItemsHtml();
      }, 30000);
    }

    function renderWeatherDetailsDetail(d) {
      const banner = '<img class="card-banner" src="/images/weather-hero.jpg" alt="" />';
      const title = '🌤️ Weather Details';
      if (!d) return '<div class="card">' + banner + '<h2>' + title + '</h2><p class="unavailable">Unavailable right now</p></div>';

      const w = d.weather;
      const pollen = d.pollen;
      const wd = d.weatherDetail;

      let pollenBlock = '';
      if (pollen && pollen.configured && pollen.types && pollen.types.length) {
        const bars = pollen.types.map(t => {
          const pct = t.value != null ? Math.min(100, (t.value / 5) * 100) : 0;
          const catCls = pollenCategoryClass(t.category);
          return '<div class="pollen-row">'
            + '<div class="pollen-row-top"><span class="pollen-type">' + t.displayName + '</span><span class="pollen-cat ' + catCls + '">' + (t.category || '—') + '</span></div>'
            + '<div class="pollen-bar-track"><div class="pollen-bar-fill ' + catCls + '" style="width:' + pct + '%"></div></div>'
            + (t.recommendation ? '<div class="pollen-tip">' + t.recommendation + '</div>' : '')
            + '</div>';
        }).join('');
        pollenBlock = '<h3 class="wd-subhead">Pollen forecast' + (pollen.date ? ' — ' + pollen.date : '') + '</h3><div class="pollen-list">' + bars + '</div>';
      } else if (pollen && pollen.configured === false) {
        pollenBlock = '<h3 class="wd-subhead">Pollen forecast</h3><p class="unavailable">' + pollen.message + '</p>';
      } else if (pollen && pollen.unavailable) {
        pollenBlock = '<h3 class="wd-subhead">Pollen forecast</h3><p class="unavailable">Unavailable right now (' + pollen.error + ')</p>';
      }

      let extraBlock = '';
      if (wd && wd.configured) {
        const stats = [
          wd.humidityPct != null ? ['Humidity', wd.humidityPct + '%'] : null,
          wd.dewPointC != null ? ['Dew point', Math.round(wd.dewPointC) + '°'] : null,
          wd.windGustKph != null ? ['Wind gusts', Math.round(wd.windGustKph) + ' km/h'] : null,
          wd.windDirection ? ['Wind direction', wd.windDirection] : null,
          wd.cloudCoverPct != null ? ['Cloud cover', wd.cloudCoverPct + '%'] : null,
          wd.visibilityKm != null ? ['Visibility', wd.visibilityKm + ' km'] : null,
          wd.pressureMb != null ? ['Pressure', Math.round(wd.pressureMb) + ' mb'] : null,
          wd.thunderstormChancePct != null ? ['Storm chance', wd.thunderstormChancePct + '%'] : null,
        ].filter(Boolean);
        if (stats.length) {
          extraBlock = '<h3 class="wd-subhead">Current conditions detail</h3><div class="wd-stats-grid">'
            + stats.map(([label, value]) => '<div class="wd-stat"><div class="wd-stat-label">' + label + '</div><div class="wd-stat-value">' + value + '</div></div>').join('')
            + '</div>';
        }
      } else if (wd && wd.configured === false) {
        extraBlock = '<h3 class="wd-subhead">Current conditions detail</h3><p class="unavailable">' + wd.message + '</p>';
      } else if (wd && wd.unavailable) {
        extraBlock = '<h3 class="wd-subhead">Current conditions detail</h3><p class="unavailable">Unavailable right now (' + wd.error + ')</p>';
      }

      let forecastBlock = '';
      if (w && !w.unavailable && w.forecast && w.forecast.length) {
        const rows = w.forecast.map(f => {
          const dt = new Date(f.date + 'T12:00:00');
          const dayName = isNaN(dt) ? f.date : DAY_NAMES[dt.getDay()];
          return '<div class="wd-forecast-row">'
            + '<span class="wd-forecast-day">' + dayName + '</span>'
            + '<span class="wd-forecast-emoji">' + f.emoji + '</span>'
            + '<span class="wd-forecast-cond">' + f.condition + '</span>'
            + '<span class="wd-forecast-rain">' + (f.rainChancePct != null ? f.rainChancePct + '% rain' : '') + '</span>'
            + '<span class="wd-forecast-temps">' + Math.round(f.maxTempC) + '&deg; <span class="lo">' + Math.round(f.minTempC) + '&deg;</span></span>'
            + '</div>';
        }).join('');
        forecastBlock = '<h3 class="wd-subhead">Extended forecast</h3><div class="wd-forecast-list">' + rows + '</div>';
      }

      return '<div class="card">' + banner + '<h2>' + title + '</h2>' + pollenBlock + extraBlock + forecastBlock + '</div>';
    }

    // Events & What's On — two independent sources on one page, matching a
    // separately-run project's own layout: an always-on, free, keyless
    // "What's On" photo feed (Cornwall Live's dedicated RSS feed) plus an
    // optional grid of ticketed events (Ticketmaster, grouped by month)
    // that only appears once that key is set. Eventbrite was tried too but
    // its public search API has been shut off for standard keys since 2020.
    function renderEventsWhatsonDetail(d) {
